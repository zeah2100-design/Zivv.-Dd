<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIVV — الإشعارات</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/professional.css" />
    <style>

      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: 'Cairo', "Segoe UI", Tahoma, Arial, sans-serif; background: #f5f6f8; color: #101418; min-height: 100dvh; }
      .wrap { width: min(520px, 100%); margin: 0 auto; padding: 16px 14px 80px; }
      h1 { font-size: 24px; font-weight: 800; margin-bottom: 12px; color: #101418; }
      .tabs { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
      .tabs::-webkit-scrollbar { display: none; }
      .tabs button {
        flex: 0 0 auto; border: 1px solid #e6e8ec; background: #ffffff; color: #5b6470;
        border-radius: 999px; padding: 8px 12px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit;
      }
      .tabs button.on { color: #fff; border-color: #111318; background: #111318; }
      .item {
        display: flex; gap: 10px; align-items: center;
        padding: 10px 4px; border-bottom: 1px solid #eef0f3;
        color: #101418; text-decoration: none;
      }
      .item img.ava {
        width: 48px; height: 48px; border-radius: 50%; object-fit: cover; flex: 0 0 auto;
        background: #f1f3f5;
      }
      .dot {
        width: 48px; height: 48px; border-radius: 50%;
        display: grid; place-items: center;
        background: rgba(225,48,108,0.08); border: 1px solid rgba(225,48,108,0.18);
        font-size: 18px; flex: 0 0 auto;
      }
      .thumb {
        width: 48px; height: 48px; border-radius: 8px; object-fit: cover; flex: 0 0 auto; background: #f1f3f5;
      }
      .body { flex: 1; min-width: 0; }
      .body p { color: #384049; font-size: 13px; line-height: 1.5; }
      .time { color: #8b95a1; font-size: 11px; margin-top: 3px; }
      .unread { width: 8px; height: 8px; border-radius: 50%; background: #e1306c; flex: 0 0 auto; }
      .empty { color: #8b95a1; text-align: center; padding: 36px 12px; font-size: 14px; }
  </style>
  </head>
  <body>
    <main class="wrap">
      <h1 data-i18n="alerts">الإشعارات</h1>
      <div class="tabs">
        <button type="button" class="on" data-t="all">الكل</button>
        <button type="button" data-t="post">منشورات</button>
        <button type="button" data-t="friend">أصدقاء</button>
        <button type="button" data-t="message">رسائل</button>
        <button type="button" data-t="official">الملك</button>
      </div>
      <div id="list"></div>
    </main>
    <script src="js/i18n.js"></script>
    <script src="js/core.js"></script>
    <script src="js/creator.js"></script>
    <script src="js/shell.js"></script>
    <script>
      function ago(at) {
        const m = Math.max(1, Math.round((Date.now() - at) / 60000));
        if (m < 60) return "منذ " + m + " د";
        const h = Math.round(m / 60);
        if (h < 24) return "منذ " + h + " س";
        return "منذ " + Math.round(h / 24) + " ي";
      }
      function person(user) {
        return ZIVV_CORE.personOf ? ZIVV_CORE.personOf(user) : { name: user, user, avatar: "brand/logo-sm.png" };
      }
      function liveExtras() {
        const extra = [];
        ZIVV_CORE.incomingFriendRequests().forEach((r) => {
          extra.push({
            type: "friend",
            from: r.from,
            fromName: r.fromName,
            text: "بعت لك طلب صداقة",
            href: "friends.html",
            at: r.at || Date.now(),
            unread: true,
          });
        });
        const official = (window.ZIVV_CREATOR && ZIVV_CREATOR.myNotes) ? ZIVV_CREATOR.myNotes() : [];
        official.forEach((n) => {
          extra.push({
            type: n.type || "official",
            from: n.from || "king",
            fromName: n.title || "الملك",
            text: n.text || n.title || "",
            href: n.href || "alerts.html?t=official",
            at: n.at || Date.now(),
            unread: n.unread !== false,
            avatar: "",
          });
        });
        return extra;
      }
      function allNotes() {
        const stored = (ZIVV_CORE.myNotes ? ZIVV_CORE.myNotes() : []).slice();
        const seen = new Set(stored.map((n) => n.id || (n.type + n.from + n.at + n.text)));
        liveExtras().forEach((n) => {
          const k = n.id || (n.type + n.from + n.at + n.text);
          if (!seen.has(k)) {
            seen.add(k);
            stored.push(n);
          }
        });
        return stored.sort((a, b) => (b.at || 0) - (a.at || 0));
      }

      let tab = new URLSearchParams(location.search).get("t") || "all";
      if (["all", "post", "friend", "message", "official", "like", "comment", "follow"].indexOf(tab) < 0) tab = "all";
      if (tab === "like" || tab === "comment" || tab === "follow") tab = "all";

      function match(n) {
        if (tab === "all") return true;
        if (tab === "official") return n.type === "official" || n.type === "gold";
        return n.type === tab;
      }

      function paint() {
        const list = allNotes().filter(match);
        document.getElementById("list").innerHTML = list.length
          ? list.map((n) => {
              const p = person(n.from);
              const name = n.fromName || p.name || n.from || "ZIVV";
              const ava = n.avatar || p.avatar || "brand/logo-sm.png";
              const king = n.type === "official" || n.from === "king" || n.from === "zivv";
              const icon = n.type === "friend" ? "👥" : n.type === "message" ? "💬" : n.type === "post" ? "✦" : n.type === "comment" ? "💬" : "★";
              return `<a class="item" href="${n.href || "alerts.html"}">
                ${king ? `<div class="dot">${icon}</div>` : `<img class="ava" src="${ava}" alt="">`}
                <div class="body">
                  <p><b>${name}</b> ${n.text || n.title || ""}</p>
                  <div class="time">${ago(n.at || Date.now())}</div>
                </div>
                ${n.thumb ? `<img class="thumb" src="${n.thumb}" alt="">` : ""}
                ${n.unread ? '<span class="unread"></span>' : ""}
              </a>`;
            }).join("")
          : '<p class="empty">مفيش إشعارات هنا لسه.</p>';
        if (ZIVV_CORE.markNotesRead) ZIVV_CORE.markNotesRead(tab === "all" ? "" : tab);
      }

      document.querySelectorAll(".tabs button").forEach((b) => {
        b.classList.toggle("on", b.getAttribute("data-t") === tab);
        b.onclick = () => {
          tab = b.getAttribute("data-t");
          document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b));
          paint();
        };
      });
      paint();
    </script>
  </body>
</html>
