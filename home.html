<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIVV — الرئيسية</title>
    <style>
      :root {
        --ig: linear-gradient(135deg, #fcaf45 0%, #f77737 22%, #e1306c 55%, #c13584 78%, #833ab4 100%);
        --pink: #e1306c;
        --purple: #833ab4;
        --line: #262626;
        --mute: #a8a8a8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background:
          radial-gradient(900px 420px at 10% -10%, rgba(252,175,69,.10), transparent 50%),
          radial-gradient(800px 380px at 110% 110%, rgba(131,58,180,.16), transparent 46%),
          #000;
        color: #f5f5f5;
        padding-bottom: 76px;
      }
      button, input, textarea { font-family: inherit; }
      button { cursor: pointer; }
      img { display: block; max-width: 100%; }
      a { color: inherit; text-decoration: none; }
      .feed { width: min(480px, 100%); margin: 0 auto; }
      .ptitle { padding: 0 16px 4px; font-size: 16px; font-weight: 800; }
      .tags { padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
      .tags a, .tags span {
        font-size: 12px; color: #e1306c; background: #1a0b12;
        border: 1px solid #3a1524; border-radius: 999px; padding: 2px 8px;
      }
      .warn-banner {
        margin: 0 16px 10px; padding: 8px 10px; border-radius: 10px;
        border: 1px solid #5a3a12; background: #1a1408; color: #fcaf45; font-size: 12px;
      }
      .btn {
        border: 0; background: var(--ig); color: #fff;
        font-weight: 800; border-radius: 10px; padding: 8px 16px; font-size: 13px;
      }
      .post { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 6px; }
      .post-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px 10px; }
      .ava-box { position: relative; width: 48px; height: 52px; flex: 0 0 auto; }
      .ava {
        width: 44px; height: 44px; border-radius: 50%; padding: 1.5px;
        background: var(--ig); display: block; border: 0; cursor: pointer;
      }
      .ava img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; object-fit: cover; pointer-events: none; }
      .follow-plus {
        position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
        width: 22px; height: 22px; border-radius: 50%; border: 2px solid #000;
        background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
        color: #fff; font-size: 16px; font-weight: 900; line-height: 16px;
        padding: 0; display: grid; place-items: center; z-index: 4;
      }
      .follow-plus.on { background: #2ecc71; color: #062; }
      .who { font-weight: 700; font-size: 14px; cursor: pointer; }
      .meta { color: var(--mute); font-size: 12px; }
      .cap { padding: 0 16px 10px; font-size: 14px; line-height: 1.65; }
      .pic { width: 100%; max-height: 420px; object-fit: cover; background: #111; }
      .acts { display: flex; gap: 6px; padding: 8px 10px; }
      .acts button { background: none; border: 0; color: #fff; font-size: 13px; padding: 6px 8px; }
      .acts button.on { color: #e1306c; font-weight: 800; }
      .nav {
        position: fixed; bottom: 0; left: 0; right: 0; height: 62px;
        background: #000; border-top: 1px solid var(--line);
        display: flex; justify-content: space-around; align-items: center; z-index: 10;
      }
      .nav a, .nav button {
        background: none; border: 0; color: #888; font-size: 11px;
        display: flex; flex-direction: column; align-items: center; gap: 3px;
      }
      .nav .on { color: #fff; }
      .nav .plus {
        width: 42px; height: 30px; border-radius: 10px; background: var(--ig);
        color: #fff; display: grid; place-items: center; font-size: 20px; font-weight: 800;
      }
      .empty { color: var(--mute); text-align: center; padding: 28px 16px; font-size: 14px; }
      .ai-tag, .ad-tag {
        display: inline-block; margin-inline-start: 6px; font-size: 10px;
        border-radius: 999px; padding: 1px 6px;
      }
      .ai-tag { color: #fcaf45; border: 1px solid rgba(252,175,69,.4); }
      .vid { position: relative; }
      .play {
        position: absolute; inset: 0; display: grid; place-items: center;
        color: #fff; font-size: 42px; text-shadow: 0 4px 16px #000;
      }
      .link-card {
        display: block; margin: 0 16px 12px; border: 1px solid var(--line);
        border-radius: 12px; padding: 12px; background: #111;
      }
      .link-card .host { color: var(--pink); font-size: 12px; font-weight: 800; }
      .link-card span { display: block; word-break: break-all; font-size: 13px; margin-top: 4px; color: #ddd; }
      .vid video.pic { width: 100%; max-height: 420px; object-fit: cover; background: #111; }
      .toast {
        position: fixed; bottom: 78px; left: 50%; transform: translateX(-50%);
        background: #161616; border: 1px solid #333; color: #fff;
        padding: 10px 14px; border-radius: 999px; font-size: 13px; z-index: 70; display: none;
      }
      .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 60; place-items: center; }
      .modal.open { display: grid; }
      .sheet { width: min(360px, 92vw); background: #0a0a0a; border: 1px solid #262626; border-radius: 16px; padding: 16px; }
      .person {
        display: flex; align-items: center; gap: 8px; width: 100%;
        background: #111; border: 1px solid #262626; color: #fff;
        border-radius: 10px; padding: 8px; margin-bottom: 6px; text-align: start;
      }
      .person img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    </style>
    <link rel="stylesheet" href="css/shell.css" />
  </head>
  <body data-page="home">
    <main class="feed">
      <div id="posts"></div>
    </main>
    <nav class="nav">
      <a class="on" href="home.html">⌂<span data-i18n="home">الرئيسية</span></a>
      <a href="explore.html">⌕<span data-i18n="explore">اكتشف</span></a>
      <a href="publish.html"><span class="plus">+</span></a>
      <a href="reels.html">▷<span data-i18n="reels">الشريط</span></a>
      <a href="profile.html">◉<span data-i18n="profile">حسابي</span></a>
    </nav>
    <div class="toast" id="toast"></div>
    <div class="modal" id="share-modal">
      <div class="sheet">
        <h3>شارك لشخص</h3>
        <div id="share-list"></div>
        <button class="btn" id="share-close" type="button" style="width:100%;margin-top:8px;background:#161616">إغلاق</button>
      </div>
    </div>
    <script src="js/i18n.js?v=30"></script>
    <script src="js/core.js?v=30"></script>
    <script src="js/media.js?v=30"></script>
    <script src="js/social.js?v=30"></script>
    <script src="js/creator.js?v=30"></script>
    <script src="js/ads.js?v=30"></script>
    <script src="js/cc.js?v=30"></script>
    <script src="js/pwa.js?v=30"></script>
    <script src="js/shell.js?v=31"></script>
    <script>
      const session = JSON.parse(localStorage.getItem("zivv.session") || "null") || { name: "ضيف", email: "guest" };
      function livePosts() {
        const fromCore = (window.ZIVV_CORE && ZIVV_CORE.getPosts) ? ZIVV_CORE.getPosts() : [];
        let list = fromCore.length ? fromCore.slice() : (JSON.parse(localStorage.getItem("zivv.feed") || "null") || []);
        list.forEach((p) => {
          if (p.following === undefined) p.following = true;
          if (p.ai === undefined) p.ai = false;
          if (!p.type) p.type = p.videoId || p.videoKind ? "video" : p.image ? "photo" : "text";
        });
        return list;
      }
      let posts = livePosts();
      function meUser() {
        return String((ZIVV_CORE.author && ZIVV_CORE.author().user) || "").replace(/^@/, "").toLowerCase();
      }
      function applyChrome() {
        const en = localStorage.getItem("zivv.lang") === "en";
        document.documentElement.lang = en ? "en" : "ar";
        document.documentElement.dir = en ? "ltr" : "rtl";
        if (window.ZIVV_I18N) ZIVV_I18N.apply();
      }
      function homeList() {
        posts = livePosts();
        return posts.filter((p) => {
          if (p.status === "removed") return false;
          if (p.type === "audio" || p.audioId || p.audio) return false;
          if (ZIVV_CORE.isFriendsOnly && ZIVV_CORE.isFriendsOnly(p)) return false;
          if (p.videoKind === "short") return false;
          if (p.type === "video" || p.videoId) return p.videoKind !== "short";
          if (p.dests && p.dests.length && !p.dests.includes("home")) return false;
          return true;
        });
      }
      function visiblePosts() {
        const base = homeList();
        if (window.ZIVV && window.ZIVV.applyFeed) return window.ZIVV.applyFeed(base);
        return { items: base };
      }
      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(() => { el.style.display = "none"; }, 2400);
      }
      function renderPosts() {
        const result = visiblePosts();
        const list = result.items || [];
        const mixed = window.ZIVV_ADS ? ZIVV_ADS.weave(list) : list.map((p) => ({ kind: "post", item: p }));
        const me = meUser();
        document.getElementById("posts").innerHTML = mixed.map((row) => {
          if (row.kind === "ad") return ZIVV_ADS.cardHtml(row.item);
          const p = row.item;
          const liked = ZIVV_CORE.likedByMe(p.id);
          const count = ZIVV_CORE.likeCount(p);
          const comments = ZIVV_CORE.commentsOf(p);
          const pu = String(p.user || "").replace(/^@/, "").toLowerCase();
          const minePost = !!me && pu === me;
          const following = !!(ZIVV_CORE.isFollowing && pu && ZIVV_CORE.isFollowing(pu));
          const ava = (ZIVV_CORE.personOf && ZIVV_CORE.personOf(pu).avatar) || p.avatar || "brand/logo-sm.png";
          return `
            <article class="post" data-id="${p.id}" data-user="${pu}">
              <div class="post-h">
                <div class="ava-box">
                  <button class="ava ${window.ZIVV_CREATOR && ZIVV_CREATOR.isGoldUser(p.user) ? "gold" : ""}" type="button" data-profile="${pu}"><img src="${ava}" alt=""></button>
                  ${minePost ? "" : `<button class="follow-plus ${following ? "on" : ""}" type="button" data-follow="${pu}">${following ? "✓" : "+"}</button>`}
                </div>
                <div>
                  <div class="who ${window.ZIVV_CREATOR && ZIVV_CREATOR.isGoldUser(p.user) ? "gold-name" : ""}" data-profile="${pu}">${p.name}${window.ZIVV_CREATOR && ZIVV_CREATOR.isGoldUser(p.user) ? '<span class="gold-tag">مميز</span>' : ""}${p.ai ? '<span class="ai-tag">AI</span>' : ""}</div>
                  <div class="meta">@${p.user || "you"} · ${p.time}${p.place ? " · " + p.place : ""}</div>
                </div>
              </div>
              ${p.status === "warned" ? `<div class="warn-banner">تحذير: المنشور سيء — اتعامل بحذر.</div>` : ""}
              ${p.title ? `<h3 class="ptitle" data-tr="${String(p.title).replace(/"/g, "&quot;")}">${p.title}</h3>` : ""}
              <p class="cap" data-tr="${String(p.text || "").replace(/"/g, "&quot;")}">${p.text || ""}</p>
              ${(p.tags || []).length ? `<div class="tags">${p.tags.map((t) => `<a href="search.html?k=hashtag&q=${encodeURIComponent("#" + t)}">#${t}</a>`).join("")}</div>` : ""}
              ${
                p.videoId
                  ? `<video class="pic" poster="${p.image || ""}" data-media="${p.videoId}" controls playsinline ${p.muteOriginal ? "muted" : ""}></video>`
                  : p.image
                    ? p.type === "video"
                      ? `<div class="vid"><img class="pic" src="${p.image}" alt=""><div class="play">▶</div></div>`
                      : `<img class="pic" src="${p.image}" alt="">`
                    : ""
              }
              ${
                p.link
                  ? `<a class="link-card" href="${p.link}" target="_blank" rel="noopener noreferrer"><div class="host">${p.linkTitle || "رابط"}</div><span>${p.link}</span></a>`
                  : ""
              }
              ${p.promoted ? '<div class="warn-banner" style="border-color:#2a5a34;background:#0d1610;color:#9ad67a">إعلان من صاحب المنشور</div>' : ""}
              <div class="acts">
                <button type="button" class="like ${liked ? "on" : ""}">${liked ? "♥ " + count : "♡ " + count}</button>
                <button type="button" class="go-c">💬 ${comments.length}</button>
                <button type="button" class="share">↗ ${ZIVV_CORE.shareCount(p.id)}</button>
                <button type="button" class="dl">تحميل</button>
                <button type="button" class="block">الحظر</button>
                ${
                  window.ZIVV_CREATOR &&
                  ZIVV_CREATOR.isGoldUser(session.username || (session.email || "").split("@")[0]) &&
                  pu === me
                    ? `<button type="button" class="promo">${p.promoted ? "شيل الإعلان" : "حط إعلان"}</button>`
                    : ""
                }
              </div>
            </article>
          `;
        }).join("") || '<p class="empty">مفيش منشورات حسب خيارات الفيد.</p>';

        if (window.ZIVV_MEDIA) ZIVV_MEDIA.hydrate(document.getElementById("posts"));
        if (window.ZIVV_CC) {
          ZIVV_CC.bind(document.getElementById("posts"));
          ZIVV_CC.paintText(document.getElementById("posts"));
        }
        if (window.ZIVV_CREATOR) list.forEach((p) => ZIVV_CREATOR.recordView(p));

        document.querySelectorAll(".post").forEach((el) => {
          const id = el.getAttribute("data-id");
          const post = posts.find((x) => x.id === id);
          const vid = el.querySelector("video");
          if (vid) {
            vid.addEventListener("click", (e) => {
              const box = vid.getBoundingClientRect();
              if (e.clientY > box.bottom - 52) return;
              e.preventDefault();
              if (vid.paused) vid.play().catch(() => {});
              else vid.pause();
            });
          }
          function sync() {
            const liked = ZIVV_CORE.likedByMe(id);
            const count = ZIVV_CORE.likeCount(post);
            el.querySelector(".like").classList.toggle("on", liked);
            el.querySelector(".like").textContent = liked ? "♥ " + count : "♡ " + count;
            el.querySelector(".go-c").textContent = "💬 " + ZIVV_CORE.commentsOf(post).length;
            el.querySelector(".share").textContent = "↗ " + ZIVV_CORE.shareCount(id);
          }
          el.querySelector(".like").onclick = () => { ZIVV_CORE.toggleLike(id); sync(); };
          el.querySelector(".go-c").onclick = () => ZIVV_SOCIAL.openComments(post, sync);
          el.querySelector(".share").onclick = () => ZIVV_SOCIAL.openShare(post, sync);
          el.querySelector(".dl").onclick = () => {
            if (!window.ZIVV_CORE || !ZIVV_CORE.downloadPost) return;
            ZIVV_CORE.downloadPost(post).then((ok) => toast(ok ? "اتحمّل المنشور" : "مقدرناش نحمّل المنشور"));
          };
          el.querySelector(".block").onclick = () => {
            if (!confirm("تبعت بلاغ لإدارة الموقع عن المنشور ده؟ البلاغ هيتربط باسمك.")) return;
            ZIVV_CORE.reportPost(post);
            toast("اتبعت البلاغ للإدارة باسم " + ZIVV_CORE.meName());
          };
          const promo = el.querySelector(".promo");
          if (promo) promo.onclick = () => {
            if (!window.ZIVV_CREATOR || !ZIVV_CREATOR.isGoldUser()) {
              toast("الإعلان على منشوراتك للذهبي بس");
              return;
            }
            const on = ZIVV_CREATOR.togglePromo(id);
            post.promoted = on;
            localStorage.setItem("zivv.feed", JSON.stringify(posts));
            renderPosts();
            toast(on ? "المنشور بقى إعلان بتاعك" : "اتشال الإعلان من المنشور");
          };
        });
      }

      document.getElementById("posts").addEventListener("click", (e) => {
        const plus = e.target.closest("[data-follow]");
        if (plus) {
          e.preventDefault();
          e.stopPropagation();
          const u = String(plus.getAttribute("data-follow") || "").replace(/^@/, "").toLowerCase();
          if (!u || !ZIVV_CORE.followUser) return;
          if (ZIVV_CORE.isFollowing(u)) {
            ZIVV_CORE.unfollowUser(u);
            toast("اتلغت المتابعة");
          } else {
            ZIVV_CORE.followUser(u);
            toast("بقيت تتابعه");
          }
          const on = ZIVV_CORE.isFollowing(u);
          document.querySelectorAll('[data-follow="' + u + '"]').forEach((b) => {
            b.classList.toggle("on", on);
            b.textContent = on ? "✓" : "+";
          });
          return;
        }
        const who = e.target.closest("[data-profile]");
        if (who) {
          e.preventDefault();
          e.stopPropagation();
          const u = String(who.getAttribute("data-profile") || "").replace(/^@/, "").toLowerCase();
          if (!u) return;
          if (ZIVV_CORE.openProfile && ZIVV_CORE.openProfile(u)) return;
          toast("الحساب مقفول. الأصدقاء بس اللي يدخلوا.");
        }
      });

      document.getElementById("share-close").onclick = () => {
        document.getElementById("share-modal").classList.remove("open");
      };
      document.getElementById("share-modal").onclick = (e) => {
        if (e.target.id === "share-modal") e.currentTarget.classList.remove("open");
      };
      window.addEventListener("zivv-prefs", () => renderPosts());
      window.addEventListener("zivv-db", () => renderPosts());
      applyChrome();
      renderPosts();
      if (window.ZIVV_DB && ZIVV_DB.whenReady) {
        ZIVV_DB.whenReady(() => {
          if (ZIVV_DB.syncAll) ZIVV_DB.syncAll().then(() => renderPosts()).catch(() => renderPosts());
          else renderPosts();
        });
      }
    </script>
  </body>
</html>
