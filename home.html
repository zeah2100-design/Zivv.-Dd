<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIVV — الرئيسية</title>
    <style>
      :root {
        --ig: linear-gradient(135deg, #fcaf45 0%, #f77737 22%, #e1306c 55%, #c13584 78%, #833ab4 100%);
        --pink: #e1306c;
        --purple: #833ab4;
        --line: #262626;
        --mute: #a8a8a8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background:
          radial-gradient(900px 420px at 10% -10%, rgba(252,175,69,.10), transparent 50%),
          radial-gradient(800px 380px at 110% 110%, rgba(131,58,180,.16), transparent 46%),
          #000;
        color: #f5f5f5;
        padding-bottom: 76px;
      }
      button, input, textarea { font-family: inherit; }
      button { cursor: pointer; }
      img { display: block; max-width: 100%; }
      a { color: inherit; text-decoration: none; }

      .top {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        background: rgba(0,0,0,.86);
        border-bottom: 1px solid var(--line);
        backdrop-filter: blur(10px);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 800;
        letter-spacing: .28em;
        font-size: 15px;
        background: var(--ig);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .brand img { width: 28px; height: 28px; border-radius: 8px; }
      .top-actions { display: flex; gap: 8px; }
      .ico {
        width: 38px;
        height: 38px;
        border: 1px solid var(--line);
        background: #0a0a0a;
        color: #fff;
        border-radius: 10px;
        font-size: 16px;
      }

      .feed { width: min(480px, 100%); margin: 0 auto; }

      .composer {
        margin: 12px 16px;
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px;
        background: #0a0a0a;
      }
      .composer textarea {
        width: 100%;
        min-height: 64px;
        resize: none;
        background: transparent;
        border: 0;
        color: #fff;
        outline: none;
        font-size: 14px;
      }
      .composer-bar { display: flex; justify-content: space-between; align-items: center; }
      .composer-tools { display: flex; gap: 8px; margin-top: 8px; }
      .composer-tools a {
        font-size: 12px; color: #bbb; border: 1px solid var(--line);
        border-radius: 999px; padding: 4px 10px;
      }
      .ptitle { padding: 0 16px 4px; font-size: 16px; font-weight: 800; }
      .tags { padding: 0 16px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
      .tags a, .tags span {
        font-size: 12px; color: #e1306c; background: #1a0b12;
        border: 1px solid #3a1524; border-radius: 999px; padding: 2px 8px;
      }
      .warn-banner {
        margin: 0 16px 10px; padding: 8px 10px; border-radius: 10px;
        border: 1px solid #5a3a12; background: #1a1408; color: #fcaf45; font-size: 12px;
      }
      .dest-tag { color: #888; font-size: 11px; font-weight: 400; }
      .btn {
        border: 0;
        background: var(--ig);
        color: #fff;
        font-weight: 800;
        border-radius: 10px;
        padding: 8px 16px;
        font-size: 13px;
      }
      .btn:disabled { opacity: .4; }

      .post { border-bottom: 1px solid var(--line); padding-bottom: 8px; margin-bottom: 6px; }
      .post-h {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 16px 10px;
      }
      .ava {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        padding: 1.5px;
        background: var(--ig);
      }
      .ava img { width: 100%; height: 100%; border-radius: 50%; border: 2px solid #000; object-fit: cover; }
      .who { font-weight: 700; font-size: 14px; }
      .meta { color: var(--mute); font-size: 12px; }
      .cap { padding: 0 16px 10px; font-size: 14px; line-height: 1.65; }
      .pic { width: 100%; max-height: 420px; object-fit: cover; background: #111; }
      .acts { display: flex; gap: 6px; padding: 8px 10px; }
      .acts button {
        background: none;
        border: 0;
        color: #fff;
        font-size: 13px;
        padding: 6px 8px;
      }
      .acts button.on { color: #e1306c; font-weight: 800; }
      .likes { padding: 0 16px 10px; font-size: 13px; color: #ddd; }
      .comments { padding: 0 16px 12px; }
      .c { font-size: 13px; margin-bottom: 4px; color: #ddd; }
      .c b { margin-inline-end: 6px; }
      .addc {
        display: flex;
        gap: 8px;
        padding: 0 16px 14px;
      }
      .addc input {
        flex: 1;
        background: #121212;
        border: 1px solid var(--line);
        color: #fff;
        border-radius: 8px;
        padding: 8px 10px;
        outline: none;
      }
      .addc input:focus { border-color: var(--pink); }
      .addc button {
        background: none;
        border: 0;
        color: var(--pink);
        font-weight: 800;
      }

      .nav {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 62px;
        background: #000;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-around;
        align-items: center;
        z-index: 10;
      }
      .nav a, .nav button {
        background: none;
        border: 0;
        color: #888;
        font-size: 11px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 3px;
      }
      .nav .on { color: #fff; }
      .nav .plus {
        width: 42px;
        height: 30px;
        border-radius: 10px;
        background: var(--ig);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 20px;
        font-weight: 800;
      }

      .empty { color: var(--mute); text-align: center; padding: 28px 16px; font-size: 14px; }
      .ai-tag {
        display: inline-block;
        margin-inline-start: 6px;
        font-size: 10px;
        color: #fcaf45;
        border: 1px solid rgba(252,175,69,.4);
        border-radius: 999px;
        padding: 1px 6px;
      }
      .ad-tag {
        display: inline-block;
        margin-inline-start: 6px;
        font-size: 10px;
        color: #9ad67a;
        border: 1px solid rgba(61,220,132,.4);
        border-radius: 999px;
        padding: 1px 6px;
      }
      .post.ad { background: #0a0d0a; }
      .ad-acts { gap: 8px; padding: 8px 16px 14px; }
      .ad-cta {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 800;
        background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
        color: #fff;
      }
      .ad-cta.ghost {
        background: #161616;
        border: 1px solid #333;
      }
      .ad-slot { min-height: 220px; background: #111; }
      .vid {
        position: relative;
      }
      .vid .pic { filter: brightness(.85); }
      .play {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        color: #fff;
        font-size: 42px;
        text-shadow: 0 4px 16px #000;
      }
      .audio-box {
        margin: 0 16px 10px;
        padding: 12px;
        background: #111;
        border-radius: 12px;
      }
      .audio-box audio { width: 100%; }
      .link-card {
        display: block;
        margin: 0 16px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        background: #111;
      }
      .link-card .host { color: var(--pink); font-size: 12px; font-weight: 800; }
      .link-card span { display: block; word-break: break-all; font-size: 13px; margin-top: 4px; color: #ddd; }
      .vid video.pic { width: 100%; max-height: 420px; object-fit: cover; background: #111; }
      .filter-bar {
        margin: 0 16px 10px;
        color: #c13584;
        font-size: 12px;
        line-height: 1.5;
      }
      .toast {
        position: fixed;
        bottom: 78px;
        left: 50%;
        transform: translateX(-50%);
        background: #161616;
        border: 1px solid #333;
        color: #fff;
        padding: 10px 14px;
        border-radius: 999px;
        font-size: 13px;
        z-index: 70;
        display: none;
      }
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,.55);
        z-index: 60;
        place-items: center;
      }
      .modal.open { display: grid; }
      .sheet {
        width: min(360px, 92vw);
        background: #0a0a0a;
        border: 1px solid #262626;
        border-radius: 16px;
        padding: 16px;
      }
      .sheet h3 { margin-bottom: 10px; font-size: 16px; }
      .person {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        background: #111;
        border: 1px solid #262626;
        color: #fff;
        border-radius: 10px;
        padding: 8px;
        margin-bottom: 6px;
        text-align: start;
      }
      .person img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; }
    </style>
    <link rel="stylesheet" href="css/shell.css" />
  </head>
  <body data-page="home">
    <main class="feed">
      <div id="posts"></div>
    </main>

    <nav class="nav">
      <a class="on" href="home.html">⌂<span>الرئيسية</span></a>
      <a href="explore.html">⌕<span>اكتشف</span></a>
      <a href="publish.html"><span class="plus">+</span></a>
      <a href="reels.html">▷<span>الشريط</span></a>
      <a href="profile.html">◉<span>حسابي</span></a>
    </nav>

    <div class="toast" id="toast"></div>
    <div class="modal" id="share-modal">
      <div class="sheet">
        <h3>شارك لشخص</h3>
        <div id="share-list"></div>
        <button class="btn" id="share-close" type="button" style="width:100%;margin-top:8px;background:#161616">إغلاق</button>
      </div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/media.js"></script>
    <script src="js/social.js"></script>
    <script src="js/creator.js"></script>
    <script src="js/ads.js?v=19"></script>
    <script src="js/shell.js"></script>
    <script>
      const session = JSON.parse(localStorage.getItem("zivv.session") || "null") || { name: "ضيف", email: "guest" };

      const seed = [];

            const CANON = {};
      seed.forEach((s) => {
        CANON[s.id] = { ai: s.ai, type: s.type, following: s.following, image: s.image };
      });

      function livePosts() {
        const fromCore = (window.ZIVV_CORE && ZIVV_CORE.getPosts) ? ZIVV_CORE.getPosts() : [];
        let list = fromCore.length ? fromCore.slice() : (JSON.parse(localStorage.getItem("zivv.feed") || "null") || []);
        seed.forEach((s) => {
          if (!list.some((p) => p.id === s.id)) list.push(s);
        });
        list.forEach((p) => {
          if (CANON[p.id]) Object.assign(p, CANON[p.id]);
          if (p.following === undefined) p.following = true;
          if (p.ai === undefined) p.ai = false;
          if (!p.type) p.type = p.videoId || p.videoKind ? "video" : p.image ? "photo" : "text";
        });
        return list;
      }
      let posts = livePosts();

      function applyChrome() {
        document.documentElement.lang = "ar";
        document.documentElement.dir = "rtl";
      }

      function homeList() {
        posts = livePosts();
        return posts.filter((p) => {
          if (p.status === "removed") return false;
          if (p.videoKind === "short") return false;
          if ((p.dests || []).includes("reels") && !(p.dests || []).includes("home") && p.type === "video") return false;
          if (p.dests && p.dests.length && !p.dests.includes("home") && p.type !== "video") return false;
          return true;
        });
      }

      function visiblePosts() {
        const base = homeList();
        if (window.ZIVV && window.ZIVV.applyFeed) return window.ZIVV.applyFeed(base);
        return { items: base, total: base.length, shown: base.length, follow: 0, other: 0 };
      }

      function renderPosts() {
        const result = visiblePosts();
        const list = result.items || [];
        const mixed = window.ZIVV_ADS ? ZIVV_ADS.weave(list) : list.map((p) => ({ kind: "post", item: p }));
        document.getElementById("posts").innerHTML = mixed.map((row) => {
          if (row.kind === "ad") return ZIVV_ADS.cardHtml(row.item);
          const p = row.item;
          const liked = ZIVV_CORE.likedByMe(p.id);
          const count = ZIVV_CORE.likeCount(p);
          const comments = ZIVV_CORE.commentsOf(p);
          return `
            <article class="post" data-id="${p.id}">
              <div class="post-h">
                <div class="ava ${window.ZIVV_CREATOR && ZIVV_CREATOR.isGoldUser(p.user) ? "gold" : ""}"><img src="${p.avatar || "brand/logo-sm.png"}" alt=""></div>
                <div>
                  <div class="who ${window.ZIVV_CREATOR && ZIVV_CREATOR.isGoldUser(p.user) ? "gold-name" : ""}">${p.name}${window.ZIVV_CREATOR && ZIVV_CREATOR.isGoldUser(p.user) ? '<span class="gold-tag">مميز</span>' : ""}${p.ai ? '<span class="ai-tag">AI</span>' : ""}</div>
                  <div class="meta">@${p.user || "you"} · ${p.time}${p.place ? " · " + p.place : ""}${p.following === false ? " · مقترح" : ""}</div>
                </div>
              </div>
              ${p.status === "warned" ? `<div class="warn-banner">تحذير: المنشور سيء — اتعامل بحذر.</div>` : ""}
              ${p.title ? `<h3 class="ptitle">${p.title}</h3>` : ""}
              <p class="cap">${p.text || ""}</p>
              ${(p.tags || []).length ? `<div class="tags">${p.tags.map((t) => `<a href="search.html?k=hashtag&q=${encodeURIComponent("#" + t)}">#${t}</a>`).join("")}</div>` : ""}
              ${
                p.videoId
                  ? `<video class="pic" poster="${p.image || ""}" data-media="${p.videoId}" controls playsinline ${p.muteOriginal ? "muted" : ""}></video>`
                  : p.image
                    ? p.type === "video"
                      ? `<div class="vid"><img class="pic" src="${p.image}" alt=""><div class="play">▶</div></div>`
                      : `<img class="pic" src="${p.image}" alt="">`
                    : ""
              }
              ${
                p.audioId
                  ? `<div class="audio-box"><audio controls data-media="${p.audioId}"></audio></div>`
                  : p.audio
                    ? `<div class="audio-box"><audio controls src="${p.audio}"></audio></div>`
                    : ""
              }
              ${
                p.link
                  ? `<a class="link-card" href="${p.link}" target="_blank" rel="noopener noreferrer"><div class="host">${p.linkTitle || "رابط"}</div><span>${p.link}</span></a>`
                  : ""
              }
              ${p.promoted ? '<div class="warn-banner" style="border-color:#2a5a34;background:#0d1610;color:#9ad67a">إعلان من صاحب المنشور</div>' : ""}
              <div class="acts">
                <button type="button" class="like ${liked ? "on" : ""}">${liked ? "♥ " + count : "♡ " + count}</button>
                <button type="button" class="go-c">💬 ${comments.length}</button>
                <button type="button" class="share">↗ ${ZIVV_CORE.shareCount(p.id)}</button>
                <button type="button" class="dl">تحميل</button>
                <button type="button" class="block">الحظر</button>
                ${
                  window.ZIVV_CREATOR &&
                  ZIVV_CREATOR.isGoldUser(session.username || (session.email || "").split("@")[0]) &&
                  String(p.user || "").toLowerCase() === String(ZIVV_CORE.author().user || "").toLowerCase()
                    ? `<button type="button" class="promo">${p.promoted ? "شيل الإعلان" : "حط إعلان"}</button>`
                    : ""
                }
              </div>
            </article>
          `;
        }).join("") || '<p class="empty">مفيش منشورات حسب خيارات الفيد.</p>';

        if (window.ZIVV_MEDIA) ZIVV_MEDIA.hydrate(document.getElementById("posts"));
        if (window.ZIVV_CREATOR) {
          list.forEach((p) => ZIVV_CREATOR.recordView(p));
        }

        document.querySelectorAll(".post").forEach((el) => {
          const id = el.getAttribute("data-id");
          const post = posts.find((x) => x.id === id);
          if (window.ZIVV_MEDIA && post && post.soundId) ZIVV_MEDIA.bindSound(el, post);
          const vid = el.querySelector("video");
          if (vid) {
            vid.addEventListener("click", (e) => {
              const box = vid.getBoundingClientRect();
              if (e.clientY > box.bottom - 52) return;
              e.preventDefault();
              if (vid.paused) vid.play().catch(() => {});
              else vid.pause();
            });
          }
          function sync() {
            const liked = ZIVV_CORE.likedByMe(id);
            const count = ZIVV_CORE.likeCount(post);
            el.querySelector(".like").classList.toggle("on", liked);
            el.querySelector(".like").textContent = liked ? "♥ " + count : "♡ " + count;
            el.querySelector(".go-c").textContent = "💬 " + ZIVV_CORE.commentsOf(post).length;
            el.querySelector(".share").textContent = "↗ " + ZIVV_CORE.shareCount(id);
          }
          el.querySelector(".like").onclick = () => { ZIVV_CORE.toggleLike(id); sync(); };
          el.querySelector(".go-c").onclick = () => ZIVV_SOCIAL.openComments(post, sync);
          el.querySelector(".share").onclick = () => ZIVV_SOCIAL.openShare(post, sync);
          el.querySelector(".dl").onclick = () => {
            if (!window.ZIVV_CORE || !ZIVV_CORE.downloadPost) return;
            ZIVV_CORE.downloadPost(post).then((ok) => toast(ok ? "اتحمّل المنشور" : "مقدرناش نحمّل المنشور"));
          };
          el.querySelector(".block").onclick = () => {
            if (!confirm("تبعت بلاغ لإدارة الموقع عن المنشور ده؟ البلاغ هيتربط باسمك.")) return;
            ZIVV_CORE.reportPost(post);
            toast("اتبعت البلاغ للإدارة باسم " + ZIVV_CORE.meName());
          };
          const promo = el.querySelector(".promo");
          if (promo) promo.onclick = () => {
            if (!window.ZIVV_CREATOR || !ZIVV_CREATOR.isGoldUser()) {
              toast("الإعلان على منشوراتك للذهبي بس");
              return;
            }
            const on = ZIVV_CREATOR.togglePromo(id);
            post.promoted = on;
            persist();
            renderPosts();
            toast(on ? "المنشور بقى إعلان بتاعك" : "اتشال الإعلان من المنشور");
          };
        });
      }

      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(() => { el.style.display = "none"; }, 2400);
      }

      function openShare(post) {
        const box = document.getElementById("share-list");
        box.innerHTML = ZIVV_CORE.PEOPLE.map((p) =>
          `<button class="person" type="button" data-u="${p.user}"><img src="${p.avatar}" alt="">${p.name}</button>`
        ).join("");
        box.querySelectorAll(".person").forEach((b) => {
          b.onclick = () => {
            ZIVV_CORE.sharePost(post, b.getAttribute("data-u"));
            document.getElementById("share-modal").classList.remove("open");
            toast("اتشاركت لـ " + b.textContent + " من غير رابط");
          };
        });
        document.getElementById("share-modal").classList.add("open");
      }

      function persist() {
        localStorage.setItem("zivv.feed", JSON.stringify(posts));
      }

      document.getElementById("share-close").onclick = () => {
        document.getElementById("share-modal").classList.remove("open");
      };
      document.getElementById("share-modal").onclick = (e) => {
        if (e.target.id === "share-modal") e.currentTarget.classList.remove("open");
      };
      window.addEventListener("zivv-prefs", () => renderPosts());
      applyChrome();
      renderPosts();
    </script>
  </body>
</html>
