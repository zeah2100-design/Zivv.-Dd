<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIVV — نشر منشور</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background:
          radial-gradient(900px 420px at 10% -10%, rgba(252,175,69,.10), transparent 50%),
          radial-gradient(800px 380px at 110% 110%, rgba(131,58,180,.16), transparent 46%),
          #000;
        color: #f5f5f5;
        min-height: 100dvh;
      }
      button, input, textarea { font-family: inherit; }
      button { cursor: pointer; }
      img { display: block; max-width: 100%; }
      a { color: inherit; text-decoration: none; }
      .wrap { width: min(520px, 100%); margin: 0 auto; padding: 12px 14px 40px; }
      .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
      .ghost {
        background: #121212; border: 1px solid #262626; color: #fff;
        border-radius: 10px; padding: 8px 12px; font-size: 13px;
      }
      .title {
        font-weight: 800; letter-spacing: .08em;
        background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .me { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
      .me img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; border: 2px solid #e1306c; }
      .who { font-weight: 800; font-size: 14px; }
      .meta { color: #a8a8a8; font-size: 12px; }
      .types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 12px; }
      .sound-box, .product-box {
        display: none; gap: 8px; margin-bottom: 12px;
        background: #0a0a0a; border: 1px solid #262626; border-radius: 14px; padding: 12px;
      }
      .sound-box.show, .product-box.show { display: block; }
      .sound-box .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
      .sound-box button, .mute-btn {
        background: #151515; border: 1px solid #333; color: #fff;
        border-radius: 10px; padding: 8px 12px; font-size: 13px;
      }
      .mute-btn.on { border-color: #e1306c; color: #fff; background: #1a0b12; }
      .types button {
        background: #111; border: 1px solid #262626; color: #ddd;
        border-radius: 12px; padding: 10px 4px; font-size: 12px;
      }
      .types button.on { border-color: #e1306c; color: #fff; box-shadow: 0 0 0 1px rgba(225,48,108,.35); }
      .types i { display: block; font-style: normal; font-size: 18px; margin-bottom: 4px; }
      .vkind { display: none; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
      .vkind.show { display: grid; }
      .vkind button {
        background: #111; border: 1px solid #262626; color: #ddd;
        border-radius: 14px; padding: 12px 10px; text-align: start;
      }
      .vkind button.on { border-color: #e1306c; color: #fff; }
      .vkind b { display: block; font-size: 14px; margin-bottom: 4px; }
      .vkind span { color: #888; font-size: 12px; line-height: 1.4; }
      .drop {
        border: 1px dashed #333; border-radius: 16px; min-height: 180px;
        background: #0a0a0a; display: grid; place-items: center; text-align: center;
        padding: 18px; color: #a8a8a8; font-size: 13px; line-height: 1.7;
        position: relative; overflow: hidden; margin-bottom: 12px;
      }
      .drop.has { padding: 0; min-height: 220px; }
      .drop img, .drop video { width: 100%; max-height: 360px; object-fit: cover; background: #111; }
      .drop audio { width: 90%; margin: 40px auto; }
      .x {
        position: absolute; top: 8px; left: 8px; width: 32px; height: 32px;
        border: 0; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff; font-size: 18px; z-index: 2;
      }
      .pick {
        margin-top: 8px; background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
        color: #fff; border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 800; font-size: 13px;
      }
      label.lbl { display: block; font-size: 12px; color: #aaa; margin: 0 2px 6px; }
      textarea, .field {
        width: 100%; background: #0a0a0a; border: 1px solid #262626; color: #fff;
        border-radius: 12px; padding: 12px; outline: none; font-size: 14px;
      }
      textarea { min-height: 96px; resize: vertical; margin-bottom: 8px; }
      textarea:focus, .field:focus { border-color: #e1306c; }
      .count { color: #666; font-size: 11px; text-align: left; margin-bottom: 12px; }
      .field { margin-bottom: 12px; }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: -4px 0 12px; }
      .chips button {
        background: #151515; border: 1px solid #333; color: #ddd;
        border-radius: 999px; padding: 5px 10px; font-size: 12px;
      }
      .chips button.on { border-color: #e1306c; color: #fff; }
      .dest {
        background: #111; border: 1px solid #262626; border-radius: 12px;
        padding: 10px 12px; font-size: 13px; line-height: 1.6; margin-bottom: 12px; color: #ddd;
      }
      .dest b { color: #e1306c; }
      .link-box { margin-bottom: 12px; }
      .link-card {
        display: block; border: 1px solid #262626; border-radius: 12px;
        padding: 12px; background: #111; margin-top: 8px;
      }
      .link-card .host { color: #e1306c; font-size: 12px; font-weight: 800; }
      .link-card span { display: block; word-break: break-all; font-size: 13px; margin-top: 4px; }
      .btn {
        width: 100%; border: 0; background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
        color: #fff; font-weight: 800; border-radius: 12px; padding: 12px; font-size: 15px;
      }
      .btn:disabled { opacity: .4; }
      .hint { color: #888; font-size: 12px; line-height: 1.6; margin: 10px 0 14px; }
      .toast {
        position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
        background: #161616; border: 1px solid #333; color: #fff;
        padding: 10px 14px; border-radius: 999px; font-size: 13px;
        z-index: 70; display: none; max-width: 90vw; text-align: center;
      }
      .ban {
        display: none; margin-bottom: 12px; padding: 12px; border-radius: 12px;
        border: 1px solid #5a1a24; background: #2a0d12; color: #ff8aa0; font-size: 13px; line-height: 1.6;
      }
      .ban.show { display: block; }
      input[type="file"] { display: none; }
      .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
      .pair button {
        background: #111; border: 1px solid #262626; color: #ddd;
        border-radius: 14px; padding: 10px; text-align: start;
      }
      .pair button.on { border-color: #e1306c; color: #fff; }
      .pair b { display: block; margin-bottom: 4px; }
      .pair span { color: #888; font-size: 12px; line-height: 1.4; }
      .dest.bad { border-color: #5a1a24; color: #ff8aa0; background: #2a0d12; }
      .dest.ok { border-color: #2a5a34; }
    </style>
  </head>
  <body>
    <main class="wrap">
      <div class="bar">
        <a class="ghost" href="home.html">إلغاء</a>
        <div class="title">نشر جديد</div>
        <span style="width:64px"></span>
      </div>

      <div class="me" id="me"></div>
      <div class="ban" id="ban"></div>

      <div class="types" id="types">
        <button type="button" class="on" data-t="photo"><i>🖼</i>صورة</button>
        <button type="button" data-t="video"><i>▶</i>فيديو</button>
        <button type="button" data-t="text"><i>Aa</i>نص</button>
        <button type="button" data-t="audio"><i>♪</i>صوت</button>
        <button type="button" data-t="link"><i>🔗</i>رابط</button>
        <button type="button" data-t="product"><i>🛍</i>منتج</button>
      </div>

      <div class="vkind" id="vkind">
        <button type="button" data-vk="short"><b>شورتس</b><span>هينزل على الشريط زي تيك توك</span></button>
        <button type="button" data-vk="video"><b>فيديو عادي</b><span>هينزل على الرئيسية كمنشور فيديو</span></button>
      </div>

      <div class="sound-box" id="sound-box">
        <div class="row">
          <button type="button" id="add-sound">♪ إضافة صوت</button>
          <button type="button" class="mute-btn" id="mute-orig">كتم الصوت الأصلي</button>
        </div>
        <div class="meta" id="sound-name">الصوت الأصلي هيفضل زي ما هو. لو عايز تركّب صوت تاني، اضغط إضافة صوت وكتم الأصلي.</div>
      </div>

      <div class="product-box" id="product-box">
        <label class="lbl">سعر المنتج (ج.م)</label>
        <input class="field" id="p-price" type="number" min="0" placeholder="مثلاً 250" />
        <label class="lbl">رقم التواصل</label>
        <input class="field" id="p-phone" placeholder="01xxxxxxxxx" />
        <label class="lbl">المواصفات (اختياري — افصل بفاصلة)</label>
        <input class="field" id="p-specs" placeholder="المقاس، الخامة، اللون" />
      </div>

      <div class="drop" id="drop">
        <div id="drop-empty">
          اختار صورة أو فيديو من جهازك
          <div><button class="pick" id="pick-btn" type="button">اختيار من الجهاز</button></div>
        </div>
        <button class="x" id="clear-media" type="button" hidden>×</button>
        <img id="prev-img" alt="" hidden />
        <video id="prev-vid" muted playsinline controls hidden></video>
        <audio id="prev-aud" controls hidden></audio>
      </div>

      <div class="link-box" id="link-box" hidden>
        <label class="lbl">الرابط</label>
        <input class="field" id="link-url" type="url" placeholder="https://example.com" dir="ltr" />
        <div class="link-card" id="link-card" hidden>
          <div class="host" id="link-host"></div>
          <span id="link-text"></span>
        </div>
      </div>

      <label class="lbl">العنوان</label>
      <input class="field" id="post-title" maxlength="80" placeholder="عنوان المنشور" />
      <label class="lbl">الوصف</label>
      <textarea id="caption" maxlength="2000" placeholder="إيه اللي بيحصل؟ اكتب الوصف هنا"></textarea>
      <div class="count"><span id="n">0</span>/2000</div>
      <label class="lbl">العلامات (هاشتاج) — بتنظّم مكان النشر</label>
      <input class="field" id="tags" placeholder="#شورتس #موسيقى #القاهرة" />
      <div class="chips" id="chips"></div>
      <div class="dest" id="dest">هينشر في: <b>استكشف</b></div>
      <label class="lbl">المكان (اختياري)</label>
      <input class="field" id="place" placeholder="مثلاً الجيزة" />

      <div class="ai-box" id="ai-box">
        <label class="lbl">هل المنشور معمول بالذكاء الاصطناعي؟</label>
        <div class="pair">
          <button type="button" id="ai-no" data-ai="no"><b>لا</b><span>محتوى بشري — مش AI</span></button>
          <button type="button" id="ai-yes" data-ai="yes"><b>نعم</b><span>المحتوى معمول بالذكاء الاصطناعي</span></button>
        </div>
      </div>
      <div class="dest" id="scan-box">فحص الفلتر هيظهر هنا</div>
      <div class="okscan" id="okscan"></div>
      <label class="lbl" id="promo-wrap" hidden>
        <input type="checkbox" id="promo" /> حط المنشور كإعلان (للذهبي بس — على منشورك فقط)
      </label>
      <p class="hint">الذكاء بيفحص المنشور وهو بيتكتب. المنشور العادي هينشر حتى لو AI وهيتوسم. المنتج لو الذكاء شافه مصنوع أو وهمي مش هينشر.</p>
      <button class="btn" id="go" type="button">نشر</button>
    </main>

    <input id="file" type="file" />
    <input id="sound-file" type="file" accept="audio/*" />
    <div class="toast" id="toast"></div>

    <script src="js/core.js"></script>
    <script src="js/media.js"></script>
    <script src="js/store.js"></script>
    <script src="js/creator.js"></script>
    <script src="js/shell.js"></script>
    <script>
      const SUGGEST = ["شورتس", "موسيقى", "صورة", "موضة", "سفر", "فن", "ليل", "القاهرة", "الجيزة", "منتج"];
      const me = ZIVV_CORE.author();
      document.getElementById("me").innerHTML =
        `<img src="${me.avatar}" alt=""><div><div class="who">${me.name}</div><div class="meta">@${me.user}</div></div>`;

      let kind = "photo";
      let videoKind = "";
      let imageData = "";
      let videoFile = null;
      let audioFile = null;
      let soundFile = null;
      let muteOriginal = false;
      let objectUrl = "";
      let aiChoice = "";

      const fileEl = document.getElementById("file");
      const drop = document.getElementById("drop");
      const empty = document.getElementById("drop-empty");
      const prevImg = document.getElementById("prev-img");
      const prevVid = document.getElementById("prev-vid");
      const prevAud = document.getElementById("prev-aud");
      const clearBtn = document.getElementById("clear-media");
      const linkBox = document.getElementById("link-box");
      const caption = document.getElementById("caption");
      const titleEl = document.getElementById("post-title");
      const tagsEl = document.getElementById("tags");
      const vkindBox = document.getElementById("vkind");

      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(() => { el.style.display = "none"; }, 2800);
      }

      function revoke() {
        if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = ""; }
      }

      function hidePreviews() {
        prevImg.hidden = true;
        prevVid.hidden = true;
        prevVid.pause();
        prevAud.hidden = true;
        prevAud.pause();
        clearBtn.hidden = true;
        empty.hidden = false;
        drop.classList.remove("has");
      }

      function clearMedia() {
        revoke();
        imageData = "";
        videoFile = null;
        audioFile = null;
        fileEl.value = "";
        hidePreviews();
      }

      function showMedia() {
        empty.hidden = true;
        drop.classList.add("has");
        clearBtn.hidden = false;
      }

      function currentTags() {
        return ZIVV_CORE.parseTags(tagsEl.value);
      }

      function setTags(list) {
        tagsEl.value = list.map((t) => "#" + t.replace(/^#/, "")).join(" ");
        paintChips();
        paintDest();
      }

      function paintChips() {
        const have = new Set(currentTags().map((t) => ZIVV_CORE.norm(t)));
        document.getElementById("chips").innerHTML = SUGGEST.map((t) =>
          `<button type="button" class="${have.has(ZIVV_CORE.norm(t)) ? "on" : ""}" data-tag="${t}">#${t}</button>`
        ).join("");
      }

      function currentDraft() {
        return {
          type: kind,
          videoKind,
          tags: tagsEl.value,
          text: caption.value,
          title: titleEl.value,
          image: imageData,
          price: Number(document.getElementById("p-price").value) || 0,
          phone: document.getElementById("p-phone").value.trim(),
          specs: document.getElementById("p-specs").value.split(/[,،]/).map((s) => s.trim()).filter(Boolean),
        };
      }

      function paintDest() {
        const review = ZIVV_CORE.reviewPost(currentDraft());
        const labels = ZIVV_CORE.destLabels();
        const names = review.dests.map((d) => labels[d] || d);
        document.getElementById("dest").innerHTML = "هينشر في: <b>" + (names.join(" · ") || "استكشف") + "</b>";
        const box = document.getElementById("scan-box");
        if (kind === "product") {
          const ps = review.productScan;
          if (ps && !ps.real) {
            box.className = "dest bad";
            box.innerHTML = "<b>المنتج مش هينشر.</b> " + (ps.note || "");
          } else {
            box.className = "dest ok";
            box.innerHTML = "<b>فحص المنتج:</b> حقيقي، ومفيش ذكاء اصطناعي. ينفع ينشر.";
          }
        } else {
          const flagged = aiChoice === "yes" || !!(review.aiScan && review.aiScan.ai);
          box.className = flagged ? "dest" : "dest ok";
          box.innerHTML = flagged
            ? "<b>الذكاء شاف المنشور AI.</b> هينشر عادي ويتوسم AI. مش هيتمنع."
            : "<b>الذكاء شاف المنشور بشري.</b> هينشر عادي.";
        }
      }

      function setKind(next) {
        kind = next;
        document.querySelectorAll("#types button").forEach((b) => {
          b.classList.toggle("on", b.getAttribute("data-t") === kind);
        });
        const needsFile = kind === "photo" || kind === "video" || kind === "audio";
        drop.style.display = needsFile || kind === "product" ? "grid" : "none";
        linkBox.hidden = kind !== "link";
        vkindBox.classList.toggle("show", kind === "video");
        document.getElementById("sound-box").classList.toggle("show", kind === "video");
        document.getElementById("product-box").classList.toggle("show", kind === "product");
        document.getElementById("ai-box").style.display = kind === "product" ? "none" : "block";
        if (kind === "product") aiChoice = "";
        document.querySelectorAll("#ai-box button").forEach((b) => b.classList.remove("on"));
        if (kind !== "video") {
          videoKind = "";
          soundFile = null;
          muteOriginal = false;
        }
        if (kind === "product") {
          const tags = currentTags();
          if (!tags.some((t) => ZIVV_CORE.norm(t) === "منتج")) tags.push("منتج");
          setTags(tags);
        }
        if (kind === "photo") {
          empty.innerHTML = 'اختار صورة من جهازك<div><button class="pick" id="pick-btn" type="button">اختيار صورة</button></div>';
          fileEl.accept = "image/*";
        } else if (kind === "video") {
          empty.innerHTML = 'اختار فيديو من جهازك<div><button class="pick" id="pick-btn" type="button">اختيار فيديو</button></div>';
          fileEl.accept = "video/*";
        } else if (kind === "audio") {
          empty.innerHTML = 'اختار مقطع صوت<div><button class="pick" id="pick-btn" type="button">اختيار صوت</button></div>';
          fileEl.accept = "audio/*";
        } else if (kind === "product") {
          empty.innerHTML = 'صورة المنتج<div><button class="pick" id="pick-btn" type="button">اختيار صورة المنتج</button></div>';
          fileEl.accept = "image/*";
        }
        const pb = document.getElementById("pick-btn");
        if (pb) pb.onclick = () => fileEl.click();
        paintDest();
      }

      document.getElementById("types").onclick = (e) => {
        const b = e.target.closest("button[data-t]");
        if (!b) return;
        clearMedia();
        setKind(b.getAttribute("data-t"));
      };

      vkindBox.onclick = (e) => {
        const b = e.target.closest("button[data-vk]");
        if (!b) return;
        videoKind = b.getAttribute("data-vk");
        vkindBox.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
        const tags = currentTags().filter((t) => ZIVV_CORE.norm(t) !== "شورتس");
        if (videoKind === "short") tags.unshift("شورتس");
        setTags(tags);
      };

      document.getElementById("chips").onclick = (e) => {
        const b = e.target.closest("button[data-tag]");
        if (!b) return;
        const t = b.getAttribute("data-tag");
        const tags = currentTags();
        const i = tags.findIndex((x) => ZIVV_CORE.norm(x) === ZIVV_CORE.norm(t));
        if (i >= 0) tags.splice(i, 1);
        else tags.push(t);
        setTags(tags);
      };

      document.getElementById("pick-btn").onclick = () => fileEl.click();
      drop.addEventListener("click", (e) => {
        if (e.target.id === "clear-media") return;
        if (!drop.classList.contains("has") && kind !== "text" && kind !== "link") fileEl.click();
      });

      const soundFileEl = document.getElementById("sound-file");
      document.getElementById("add-sound").onclick = () => soundFileEl.click();
      document.getElementById("mute-orig").onclick = () => {
        muteOriginal = !muteOriginal;
        document.getElementById("mute-orig").classList.toggle("on", muteOriginal);
        paintSound();
      };
      soundFileEl.onchange = () => {
        const f = soundFileEl.files && soundFileEl.files[0];
        if (!f) return;
        soundFile = f;
        paintSound();
      };
      function paintSound() {
        const el = document.getElementById("sound-name");
        if (soundFile && muteOriginal) el.textContent = "الصوت الأصلي مكتوم · هيتركب: " + soundFile.name;
        else if (soundFile) el.textContent = "الصوت الأصلي زي ما هو + صوت إضافي: " + soundFile.name;
        else if (muteOriginal) el.textContent = "الصوت الأصلي هيتتكتم. اختار صوت بديل من إضافة صوت.";
        else el.textContent = "الصوت الأصلي هيفضل زي ما هو. لو عايز تركّب صوت تاني، اضغط إضافة صوت وكتم الأصلي.";
      }
      clearBtn.onclick = (e) => { e.stopPropagation(); clearMedia(); };

      function compress(dataUrl, max, cb) {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement("canvas");
          c.width = Math.round(img.width * scale);
          c.height = Math.round(img.height * scale);
          c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
          cb(c.toDataURL("image/jpeg", 0.82));
        };
        img.onerror = () => cb(dataUrl);
        img.src = dataUrl;
      }

      function posterFromVideo(file) {
        return new Promise((resolve) => {
          const url = URL.createObjectURL(file);
          const v = document.createElement("video");
          v.muted = true;
          v.playsInline = true;
          v.preload = "metadata";
          v.src = url;
          const done = (data) => { URL.revokeObjectURL(url); resolve(data || ""); };
          v.onloadeddata = () => {
            try { v.currentTime = Math.min(0.3, (v.duration || 1) * 0.1); } catch { done(""); }
          };
          v.onseeked = () => {
            try {
              const c = document.createElement("canvas");
              const w = v.videoWidth || 720;
              const h = v.videoHeight || 1280;
              const scale = Math.min(1, 900 / Math.max(w, h));
              c.width = Math.round(w * scale);
              c.height = Math.round(h * scale);
              c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
              done(c.toDataURL("image/jpeg", 0.8));
            } catch { done(""); }
          };
          v.onerror = () => done("");
          setTimeout(() => done(""), 4000);
        });
      }

      fileEl.onchange = () => {
        const file = fileEl.files && fileEl.files[0];
        if (!file) return;
        revoke();
        objectUrl = URL.createObjectURL(file);
        hidePreviews();
        if (file.type.startsWith("image/")) {
          if (kind !== "product") setKind("photo");
          const r = new FileReader();
          r.onload = () => compress(r.result, 1200, (data) => {
            imageData = data;
            videoFile = null;
            audioFile = null;
            prevImg.src = data;
            prevImg.hidden = false;
            showMedia();
          });
          r.readAsDataURL(file);
        } else if (file.type.startsWith("video/")) {
          setKind("video");
          videoFile = file;
          imageData = "";
          audioFile = null;
          prevVid.src = objectUrl;
          prevVid.hidden = false;
          showMedia();
          posterFromVideo(file).then((p) => { if (p) imageData = p; });
        } else if (file.type.startsWith("audio/")) {
          setKind("audio");
          audioFile = file;
          videoFile = null;
          imageData = "";
          prevAud.src = objectUrl;
          prevAud.hidden = false;
          showMedia();
        } else {
          toast("الملف ده مش مدعوم");
        }
      };

      caption.oninput = () => {
        document.getElementById("n").textContent = caption.value.length;
        paintDest();
      };
      titleEl.oninput = paintDest;
      tagsEl.oninput = () => { paintChips(); paintDest(); };
      document.getElementById("p-price").oninput = paintDest;
      document.getElementById("p-phone").oninput = paintDest;
      document.getElementById("p-specs").oninput = paintDest;
      document.getElementById("ai-box").onclick = (e) => {
        const b = e.target.closest("button[data-ai]");
        if (!b) return;
        aiChoice = b.getAttribute("data-ai");
        document.querySelectorAll("#ai-box button").forEach((x) => x.classList.toggle("on", x === b));
        paintDest();
      };

      const linkUrl = document.getElementById("link-url");
      function paintLink() {
        const raw = linkUrl.value.trim();
        let href = "";
        try {
          const u = new URL(raw);
          if (u.protocol === "http:" || u.protocol === "https:") href = u.href;
        } catch {}
        const card = document.getElementById("link-card");
        if (!href) { card.hidden = true; return ""; }
        let host = "";
        try { host = new URL(href).hostname.replace(/^www\./, ""); } catch {}
        document.getElementById("link-host").textContent = host;
        document.getElementById("link-text").textContent = href;
        card.hidden = false;
        return href;
      }
      linkUrl.oninput = paintLink;

      function safeLink(raw) {
        try {
          const u = new URL(String(raw || "").trim());
          if (u.protocol === "http:" || u.protocol === "https:") return u.href;
        } catch {}
        return "";
      }

      function resetBtn() {
        const btn = document.getElementById("go");
        btn.disabled = false;
        btn.textContent = "نشر";
      }

      document.getElementById("go").onclick = async () => {
        const title = titleEl.value.trim();
        const text = caption.value.trim();
        const place = document.getElementById("place").value.trim();
        const href = kind === "link" ? safeLink(linkUrl.value) : "";
        const ban = document.getElementById("ban");
        ban.classList.remove("show");

        if (kind === "photo" && !imageData) return toast("اختار صورة الأول");
        if (kind === "video" && !videoFile) return toast("اختار فيديو الأول");
        if (kind === "video" && !videoKind) return toast("حدد: شورتس ولا فيديو عادي");
        if (kind === "audio" && !audioFile) return toast("اختار صوت الأول");
        if (kind === "link" && !href) return toast("حط رابط صحيح يبدأ بـ http");
        if (kind === "product" && !imageData) return toast("حط صورة للمنتج");
        if (kind === "product" && !document.getElementById("p-phone").value.trim()) return toast("حط رقم تواصل للمنتج");
        if (!title) return toast("اكتب عنوان للمنشور");
        if (!text && kind === "text") return toast("اكتب وصف المنشور");
        if (!text && kind !== "link") return toast("اكتب وصف للمنشور");
        if (!currentTags().length) return toast("حط علامة واحدة على الأقل عشان المنشور يروح مكانه الصح");

        const draft = {
          title,
          text: text || (kind === "link" ? href : ""),
          tags: tagsEl.value,
          type: kind,
          videoKind: kind === "video" ? videoKind : "",
          place: place || "",
          link: href,
        };
        const review = ZIVV_CORE.reviewPost(draft);
        if (review.scan.level === "ban") {
          ban.textContent = review.scan.note;
          ban.classList.add("show");
          ZIVV_CORE.addPost(draft);
          toast("المنشور اتحذف نهائي");
          return;
        }
        if (review.scan.level === "warn") {
          if (!confirm(review.scan.note + "\n\nتنشر برغم التحذير؟")) return;
        }

        const btn = document.getElementById("go");
        btn.disabled = true;
        btn.textContent = "بيتنشر…";

        const partial = {
          title,
          text: draft.text,
          tags: tagsEl.value,
          type: kind,
          videoKind: draft.videoKind,
          place: place || "",
          ai: kind !== "product" && (aiChoice === "yes" || !!(review.aiScan && review.aiScan.ai)),
          promoted: !!(window.ZIVV_CREATOR && ZIVV_CREATOR.isGoldUser() && document.getElementById("promo").checked),
        };

        try {
          if (kind === "photo") partial.image = imageData;
          else if (kind === "video") {
            if (imageData && imageData.length < 120000) partial.image = imageData;
            else if (imageData) {
              try {
                const pid = "post_" + Date.now();
                const raw = imageData.split(",")[1] || "";
                const bin = atob(raw);
                const arr = new Uint8Array(bin.length);
                for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
                if (window.ZIVV_MEDIA) await ZIVV_MEDIA.put(pid, new Blob([arr], { type: "image/jpeg" }));
                partial.posterId = pid;
              } catch {}
            }
            if (videoFile) {
              if (!window.ZIVV_MEDIA) throw new Error("no media");
              const id = "vid_" + Date.now();
              const blob = videoFile.slice(0, videoFile.size, videoFile.type || "video/mp4");
              await ZIVV_MEDIA.put(id, blob);
              partial.videoId = id;
              partial.type = "video";
            }
            if (!partial.videoId) throw new Error("no video id");
          } else if (kind === "audio") {
            if (audioFile && window.ZIVV_MEDIA) {
              const id = "aud_" + Date.now();
              await ZIVV_MEDIA.put(id, audioFile);
              partial.audioId = id;
            }
          } else if (kind === "link") {
            partial.link = href;
            try { partial.linkTitle = new URL(href).hostname.replace(/^www\./, ""); } catch {}
          } else if (kind === "product") {
            partial.image = imageData;
            partial.price = Number(document.getElementById("p-price").value) || 0;
            partial.phone = document.getElementById("p-phone").value.trim();
            partial.specs = document.getElementById("p-specs").value.split(/[,،]/).map((s) => s.trim()).filter(Boolean);
          }

          if (kind === "video") {
            partial.muteOriginal = !!muteOriginal;
            if (soundFile && window.ZIVV_MEDIA) {
              const sid = "snd_" + Date.now();
              await ZIVV_MEDIA.put(sid, soundFile);
              partial.soundId = sid;
              partial.soundName = soundFile.name;
            }
          }

          if (kind === "product") {
            const productScan = ZIVV_CORE.scanProductReal(partial);
            if (!productScan.real) {
              ban.textContent = productScan.note || "المنتج اترفض.";
              ban.classList.add("show");
              toast("المنتج ما اتنشرش.");
              resetBtn();
              return;
            }
            const a = ZIVV_CORE.author();
            ZIVV_STORE.addUserProduct({
              id: "pru_" + Date.now(),
              title,
              price: Number(document.getElementById("p-price").value) || 0,
              cat: "عام",
              seller: a.name,
              sellerUser: a.user,
              phone: document.getElementById("p-phone").value.trim(),
              image: imageData || "posts/fashion.jpg",
              desc: text,
              specs: document.getElementById("p-specs").value.split(/[,،]/).map((s) => s.trim()).filter(Boolean),
            });
          }

          const made = ZIVV_CORE.addPost(partial);
          if (made && made.blocked) {
            ban.textContent = made.note || "المنشور اتحذف نهائي";
            ban.classList.add("show");
            resetBtn();
            return;
          }
          const go = kind === "product"
            ? "store.html"
            : (made.dests || []).includes("reels") && !(made.dests || []).includes("home")
              ? "reels.html"
              : (made.dests || []).includes("music") && kind === "audio"
                ? "music.html"
                : "home.html";
          location.href = go;
        } catch (err) {
          resetBtn();
          toast("ما قدرناش نحفظ الملف. جرّب ملف أصغر.");
        }
      };

      if (window.ZIVV_CREATOR && ZIVV_CREATOR.isGoldUser && ZIVV_CREATOR.isGoldUser()) {
        document.getElementById("promo-wrap").hidden = false;
      }
      paintChips();
      setKind("photo");
    </script>
  </body>
</html>
