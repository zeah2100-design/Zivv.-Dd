<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIVV — الموسيقى</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background: #000;
        color: #f5f5f5;
        min-height: 100dvh;
        padding-bottom: 118px;
      }
      .wrap { width: min(640px, 100%); margin: 0 auto; padding: 12px 14px 20px; }
      h1 {
        font-size: 26px;
        font-weight: 800;
        background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      .sub { color: #888; font-size: 13px; margin: 4px 0 12px; }
      .find { display: flex; gap: 8px; margin-bottom: 12px; }
      .find input {
        flex: 1; background: #121212; border: 1px solid #262626; color: #fff;
        border-radius: 999px; padding: 10px 14px; outline: none;
      }
      .find input:focus { border-color: #e1306c; }
      .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 16px; }
      .chips::-webkit-scrollbar { display: none; }
      .chips button {
        flex: 0 0 auto; border: 1px solid #262626; background: #111; color: #ddd;
        border-radius: 999px; padding: 7px 14px; font-size: 13px;
      }
      .chips button.on { border-color: #e1306c; color: #fff; background: #1a0b12; }
      .hero {
        position: relative; border-radius: 16px; overflow: hidden;
        min-height: 180px; margin-bottom: 18px;
      }
      .hero img { width: 100%; height: 200px; object-fit: cover; display: block; filter: brightness(.55); }
      .hero .info { position: absolute; inset: auto 12px 12px 12px; }
      .hero .k { font-size: 11px; color: #fcaf45; font-weight: 800; letter-spacing: .08em; }
      .hero h2 { font-size: 22px; margin: 4px 0; }
      .playbig {
        border: 0; border-radius: 999px; padding: 8px 16px; font-weight: 800; color: #fff;
        background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
      }
      h3 { font-size: 16px; margin: 6px 0 10px; }
      .rail { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 16px; }
      .rail::-webkit-scrollbar { display: none; }
      .card { flex: 0 0 132px; background: none; border: 0; color: #fff; text-align: start; }
      .card img, .card .ph {
        width: 132px; height: 132px; border-radius: 12px; object-fit: cover; display: block;
        background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
      }
      .card .ph { display: grid; place-items: center; font-size: 36px; }
      .card b { display: block; font-size: 13px; margin-top: 6px; }
      .card span { color: #888; font-size: 11px; }
      .song {
        display: flex; gap: 10px; align-items: center; width: 100%;
        background: none; border: 0; color: #fff; text-align: start;
        padding: 8px 0; border-bottom: 1px solid #1a1a1a;
      }
      .song img, .song .ph {
        width: 48px; height: 48px; border-radius: 8px; object-fit: cover;
        background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
        display: grid; place-items: center; flex: 0 0 auto;
      }
      .song.on b { color: #e1306c; }
      .song .meta { flex: 1; min-width: 0; background: none; border: 0; color: #fff; text-align: start; }
      .song .meta b, .song .meta span { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .song .meta span { color: #888; font-size: 12px; }
      .song .acts { display: flex; gap: 4px; }
      .song .acts button {
        background: #151515; border: 1px solid #2a2a2a; color: #ddd;
        border-radius: 8px; padding: 6px 8px; font-size: 12px;
      }
      .song .acts button.on { color: #e1306c; border-color: #e1306c; }
      .mute { color: #888; font-size: 13px; }
      .now {
        position: fixed; left: 8px; right: 8px; bottom: 10px; z-index: 40;
        border-radius: 14px; overflow: hidden;
        background: linear-gradient(180deg, #2a1a14 0%, #161016 70%, #0c0c0c 100%);
        border: 1px solid #3a2420;
        box-shadow: 0 10px 28px rgba(0,0,0,.45);
        touch-action: pan-y;
      }
      .seek {
        height: 14px; margin: 0; position: relative; cursor: pointer;
      }
      .seek .track {
        position: absolute; left: 10px; right: 10px; top: 6px; height: 3px;
        background: rgba(255,255,255,.18); border-radius: 99px; overflow: hidden;
      }
      .seek .fill {
        height: 100%; width: 0;
        background: linear-gradient(90deg, #fcaf45, #e1306c);
      }
      .swipe { overflow: hidden; }
      .now-row {
        display: flex; align-items: center; gap: 10px;
        padding: 2px 10px 10px;
        transition: transform .22s ease;
      }
      .now img, .now .ph {
        width: 48px; height: 48px; border-radius: 8px; object-fit: cover;
        background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
        display: grid; place-items: center; flex: 0 0 auto;
      }
      .now .t { flex: 1; min-width: 0; }
      .now .t b, .now .t span {
        display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      }
      .now .t span { color: #b9b9b9; font-size: 12px; }
      .ctrls { display: flex; gap: 2px; align-items: center; flex: 0 0 auto; }
      .ctrls button {
        width: 36px; height: 36px; border: 0; background: none; color: #fff; font-size: 16px;
      }
      .ctrls button.on { color: #fcaf45; }
      .ctrls #like.on { color: #e1306c; }
      .ctrls .go {
        width: 40px; height: 40px; border-radius: 50%;
        background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
      }
      .hint { color: #777; font-size: 11px; text-align: center; padding: 0 10px 8px; }
      .toast {
        position: fixed; bottom: 130px; left: 50%; transform: translateX(-50%);
        background: #1a1a1a; border: 1px solid #333; color: #fff;
        padding: 8px 14px; border-radius: 999px; font-size: 13px; z-index: 70; display: none;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <h1 data-i18n="music">الموسيقى</h1>
      <p class="sub" id="sub">اسحب الشريط من تحت يمين وشمال — زي يوتيوب ميوزك.</p>
      <div class="find"><input id="q" type="search" placeholder="دور على أغنية أو فنان…" /></div>
      <div class="chips" id="chips"></div>
      <div id="home"></div>
    </main>
    <div class="now" id="player">
      <div class="seek" id="seek"><div class="track"><div class="fill" id="prog"></div></div></div>
      <div class="swipe" id="swipe">
        <div class="now-row" id="now-row">
          <img id="p-art" alt="" hidden />
          <div class="ph" id="p-ph">♪</div>
          <div class="t">
            <b id="p-title">اختار أغنية</b>
            <span id="p-artist">ZIVV Music</span>
          </div>
          <div class="ctrls">
            <button type="button" id="like" title="لايك">♡</button>
            <button type="button" id="shuffle" title="عشوائي">⤮</button>
            <button type="button" id="prev" title="السابق">⏮</button>
            <button type="button" class="go" id="toggle" title="تشغيل">▶</button>
            <button type="button" id="next" title="التالي">⏭</button>
          </div>
        </div>
      </div>
      <div class="hint" id="hint">اسحب يمين أو شمال لتغيير الأغنية</div>
    </div>
    <audio id="audio"></audio>
    <div class="toast" id="toast"></div>
    <script src="js/i18n.js?v=24"></script>
    <script src="js/core.js?v=24"></script>
    <script src="js/media.js?v=24"></script>
    <script src="js/social.js?v=24"></script>
    <script src="js/shell.js?v=24"></script>
    <script>
      const EN = localStorage.getItem("zivv.lang") === "en";
      const L = (ar, en) => (EN ? en : ar);
      document.getElementById("sub").textContent = L(
        "اسحب الشريط من تحت يمين وشمال — زي يوتيوب ميوزك.",
        "Swipe the bar left or right — like YouTube Music."
      );
      document.getElementById("hint").textContent = L("اسحب يمين أو شمال لتغيير الأغنية", "Swipe to change the song");
      document.getElementById("q").placeholder = L("دور على أغنية أو فنان…", "Search a song or artist…");

      const COVERS = {
        m1: "posts/nile.jpg",
        m2: "posts/giza.webp",
        m3: "posts/studio.jpg",
        m4: "posts/nile2.jpg",
        m5: "posts/cinema.jpg",
        m6: "posts/fashion.jpg"
      };
      const FREQ = { m1: 196, m2: 147, m3: 220, m4: 165, m5: 110, m6: 247 };
      const TONE_LEN = 32;

      const lounge = ZIVV_CORE.MUSIC.map((m) => ({
        id: m.id,
        title: m.title,
        artist: m.artist,
        tags: m.tags,
        cover: COVERS[m.id] || "posts/studio.jpg",
        kind: "lounge",
        freq: FREQ[m.id] || 180
      }));

      const userTracks = (ZIVV_CORE.postsFor("music") || [])
        .filter((p) => p.audioId || p.audio || p.type === "audio")
        .map((p) => {
          const who = ZIVV_CORE.personOf ? ZIVV_CORE.personOf(p.user) : { name: p.name, avatar: p.avatar };
          return {
            id: p.id,
            title: p.title || p.text || L("مقطع", "Track"),
            artist: who.name || p.name || p.user,
            tags: (p.tags || []).join(" "),
            cover: p.image || who.avatar || "posts/studio.jpg",
            kind: "user",
            audioId: p.audioId || "",
            audio: p.audio || "",
            post: p
          };
        });

      const all = lounge.concat(userTracks);
      const mixes = [
        { id: "mix1", title: L("مزيج منتصف الليل", "Midnight mix"), cover: "posts/studio.jpg", ids: ["m3", "m5", "m2"] },
        { id: "mix2", title: L("على النيل", "On the Nile"), cover: "posts/nile.jpg", ids: ["m1", "m4"] },
        { id: "mix3", title: L("ذهب وحرير", "Gold & silk"), cover: "posts/fashion.jpg", ids: ["m6", "m2"] },
        { id: "mix4", title: L("بعد ١٨", "After 18"), cover: "posts/cinema.jpg", ids: ["m5", "m3", "m1"] }
      ];

      let tab = "all";
      let queue = all.slice();
      let idx = -1;
      let playing = false;
      let shuffleOn = localStorage.getItem("zivv.musicShuffle") === "1";
      let ctx = null;
      let osc = null;
      let gain = null;
      let toneStart = 0;
      let toneTimer = null;
      let raf = 0;

      const audio = document.getElementById("audio");
      const chips = [
        ["all", L("الكل", "All")],
        ["lounge", L("صالة ZIVV", "ZIVV lounge")],
        ["user", L("منشوراتك", "Your tracks")],
        ["mix", L("مزيج", "Mixes")]
      ];

      function toast(msg) {
        const el = document.getElementById("toast");
        el.textContent = msg;
        el.style.display = "block";
        setTimeout(() => { el.style.display = "none"; }, 1800);
      }
      function stopTone() {
        try { if (osc) osc.stop(); } catch {}
        osc = null;
        if (gain) try { gain.disconnect(); } catch {}
        gain = null;
        if (toneTimer) { clearTimeout(toneTimer); toneTimer = null; }
      }
      function playTone(freq) {
        stopTone();
        audio.pause();
        ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === "suspended") ctx.resume();
        osc = ctx.createOscillator();
        gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        gain.gain.value = 0.05;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        toneStart = Date.now();
        toneTimer = setTimeout(() => { if (playing) skip(1); }, TONE_LEN * 1000);
      }
      function likeId() {
        return queue[idx] ? queue[idx].id : "";
      }
      function paintLike() {
        const id = likeId();
        const on = id && ZIVV_CORE.likedByMe(id);
        const b = document.getElementById("like");
        b.textContent = on ? "♥" : "♡";
        b.classList.toggle("on", !!on);
      }
      function paintShuffle() {
        document.getElementById("shuffle").classList.toggle("on", shuffleOn);
      }
      function setProg(pct) {
        document.getElementById("prog").style.width = Math.max(0, Math.min(100, pct || 0)) + "%";
      }
      function tick() {
        cancelAnimationFrame(raf);
        if (!playing) return;
        const t = queue[idx];
        if (t && t.kind === "user" && audio.duration) {
          setProg(100 * audio.currentTime / audio.duration);
        } else if (t && t.kind === "lounge") {
          setProg(100 * ((Date.now() - toneStart) / (TONE_LEN * 1000)));
        }
        raf = requestAnimationFrame(tick);
      }
      function paintNow() {
        const t = queue[idx];
        document.getElementById("p-title").textContent = t ? t.title : L("اختار أغنية", "Pick a song");
        document.getElementById("p-artist").textContent = t ? t.artist : "ZIVV Music";
        const art = document.getElementById("p-art");
        const ph = document.getElementById("p-ph");
        if (t && t.cover) { art.src = t.cover; art.hidden = false; ph.hidden = true; }
        else { art.hidden = true; ph.hidden = false; }
        document.getElementById("toggle").textContent = playing ? "⏸" : "▶";
        paintLike();
        paintShuffle();
        paintList();
      }

      async function playAt(i) {
        if (i < 0 || i >= queue.length) return;
        idx = i;
        const t = queue[idx];
        playing = true;
        stopTone();
        paintNow();
        if (t.kind === "user" && (t.audioId || t.audio)) {
          if (t.audioId && window.ZIVV_MEDIA) {
            const url = await ZIVV_MEDIA.getUrl(t.audioId);
            audio.src = url || t.audio || "";
          } else audio.src = t.audio || "";
          audio.play().catch(() => playTone(t.freq || 180));
        } else {
          audio.pause();
          playTone(t.freq || 180);
        }
        tick();
      }
      function pause() {
        playing = false;
        audio.pause();
        stopTone();
        document.getElementById("toggle").textContent = "▶";
      }
      function resume() {
        if (idx < 0) return playAt(0);
        const t = queue[idx];
        playing = true;
        document.getElementById("toggle").textContent = "⏸";
        if (t.kind === "user" && audio.src) audio.play().catch(() => {});
        else playTone(t.freq || 180);
        tick();
      }
      function nextIndex(dir) {
        if (!queue.length) return 0;
        if (shuffleOn && queue.length > 1) {
          let n = idx;
          while (n === idx) n = Math.floor(Math.random() * queue.length);
          return n;
        }
        return (idx + dir + queue.length) % queue.length;
      }
      function skip(dir) {
        if (!queue.length) return;
        playAt(nextIndex(dir));
      }

      document.getElementById("toggle").onclick = () => (playing ? pause() : resume());
      document.getElementById("next").onclick = () => skip(1);
      document.getElementById("prev").onclick = () => skip(-1);
      document.getElementById("shuffle").onclick = () => {
        shuffleOn = !shuffleOn;
        localStorage.setItem("zivv.musicShuffle", shuffleOn ? "1" : "0");
        paintShuffle();
        toast(shuffleOn ? L("التشغيل العشوائي شغّال", "Shuffle on") : L("التشغيل العشوائي اتقفل", "Shuffle off"));
      };
      document.getElementById("like").onclick = (e) => {
        e.stopPropagation();
        const id = likeId();
        if (!id) return;
        ZIVV_CORE.toggleLike(id);
        paintLike();
        paint();
      };
      audio.onended = () => skip(1);
      audio.ontimeupdate = () => {
        if (!audio.duration) return;
        setProg(100 * audio.currentTime / audio.duration);
      };

      const seek = document.getElementById("seek");
      function seekTo(ev) {
        const r = seek.getBoundingClientRect();
        const x = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left;
        const pct = Math.max(0, Math.min(1, x / r.width));
        const t = queue[idx];
        if (!t) return;
        if (t.kind === "user" && audio.duration) {
          audio.currentTime = pct * audio.duration;
          setProg(pct * 100);
        } else if (t.kind === "lounge") {
          toneStart = Date.now() - pct * TONE_LEN * 1000;
          if (toneTimer) clearTimeout(toneTimer);
          const left = Math.max(200, (1 - pct) * TONE_LEN * 1000);
          toneTimer = setTimeout(() => { if (playing) skip(1); }, left);
          setProg(pct * 100);
        }
      }
      seek.addEventListener("pointerdown", seekTo);

      (function swipeBar() {
        const row = document.getElementById("now-row");
        let x0 = 0, y0 = 0, dx = 0, live = false;
        const area = document.getElementById("swipe");
        area.addEventListener("pointerdown", (e) => {
          if (e.target.closest("button")) return;
          live = true;
          x0 = e.clientX; y0 = e.clientY; dx = 0;
          row.style.transition = "none";
        });
        area.addEventListener("pointermove", (e) => {
          if (!live) return;
          dx = e.clientX - x0;
          if (Math.abs(e.clientY - y0) > Math.abs(dx) + 8) return;
          row.style.transform = "translateX(" + dx + "px)";
        });
        function end() {
          if (!live) return;
          live = false;
          row.style.transition = "transform .22s ease";
          if (dx < -56) { row.style.transform = "translateX(-110%)"; setTimeout(() => { row.style.transform = ""; skip(1); }, 160); }
          else if (dx > 56) { row.style.transform = "translateX(110%)"; setTimeout(() => { row.style.transform = ""; skip(-1); }, 160); }
          else row.style.transform = "";
          dx = 0;
        }
        area.addEventListener("pointerup", end);
        area.addEventListener("pointercancel", end);
        area.addEventListener("pointerleave", end);
      })();

      function filtered() {
        const q = document.getElementById("q").value.trim().toLowerCase();
        let list = all.slice();
        if (tab === "lounge") list = lounge.slice();
        if (tab === "user") list = userTracks.slice();
        if (q) {
          list = list.filter((t) =>
            (t.title + " " + t.artist + " " + (t.tags || "")).toLowerCase().includes(q)
          );
        }
        return list;
      }
      function paintList() {
        document.querySelectorAll(".song").forEach((el) => {
          el.classList.toggle("on", el.getAttribute("data-id") === (queue[idx] && queue[idx].id));
        });
      }
      function paint() {
        document.getElementById("chips").innerHTML = chips.map(([k, l]) =>
          `<button type="button" class="${k === tab ? "on" : ""}" data-t="${k}">${l}</button>`
        ).join("");
        document.querySelectorAll("#chips button").forEach((b) => {
          b.onclick = () => { tab = b.getAttribute("data-t"); paint(); };
        });

        const list = tab === "mix" ? lounge.slice() : filtered();
        const feat = list[0] || lounge[0];
        const home = document.getElementById("home");
        home.innerHTML = `
          ${feat ? `<div class="hero">
            <img src="${feat.cover}" alt="">
            <div class="info">
              <div class="k">${L("استمع الآن", "Play now")}</div>
              <h2>${feat.title}</h2>
              <p class="mute">${feat.artist}</p>
              <button class="playbig" type="button" id="hero-play">${L("تشغيل", "Play")}</button>
            </div>
          </div>` : ""}
          <h3>${L("مزيج سريع", "Quick mixes")}</h3>
          <div class="rail">${mixes.map((m) =>
            `<button class="card" type="button" data-mix="${m.id}">
              <img src="${m.cover}" alt=""><b>${m.title}</b><span>${L("مزيج ZIVV", "ZIVV mix")}</span>
            </button>`).join("")}</div>
          <h3>${tab === "user" ? L("منشورات بعلامة موسيقى", "Music posts") : L("الأغاني", "Songs")}</h3>
          <div id="songs">${list.length ? list.map((t) => {
            const post = t.post || { id: t.id, likes: 0, comments: [], user: t.artist };
            const liked = ZIVV_CORE.likedByMe(post.id);
            const likes = ZIVV_CORE.likeCount(post);
            const comms = ZIVV_CORE.commentsOf(post).length;
            return `<div class="song ${queue[idx] && queue[idx].id === t.id ? "on" : ""}" data-id="${t.id}">
              ${t.cover ? `<img src="${t.cover}" alt="">` : `<div class="ph">♪</div>`}
              <button class="meta" type="button" data-play="${t.id}">
                <b>${t.title}</b><span>${t.artist}</span>
              </button>
              <div class="acts">
                <button type="button" class="${liked ? "on" : ""}" data-like="${post.id}">${liked ? "♥" : "♡"} ${likes}</button>
                <button type="button" data-c="${post.id}">💬 ${comms}</button>
              </div>
            </div>`;
          }).join("") : `<p class="mute">${L("مفيش مقاطع في القسم ده. انشر صوت بعلامة #موسيقى وحط غلاف.", "No tracks here. Publish audio with #music and a cover.")}</p>`}</div>`;

        const hp = document.getElementById("hero-play");
        if (hp && feat) hp.onclick = () => {
          queue = list.length ? list : all.slice();
          playAt(Math.max(0, queue.findIndex((x) => x.id === feat.id)));
        };
        document.querySelectorAll("[data-play]").forEach((b) => {
          b.onclick = () => {
            queue = list.length ? list : all.slice();
            const i = queue.findIndex((x) => x.id === b.getAttribute("data-play"));
            playAt(i < 0 ? 0 : i);
          };
        });
        document.querySelectorAll("[data-like]").forEach((b) => {
          b.onclick = (e) => {
            e.stopPropagation();
            ZIVV_CORE.toggleLike(b.getAttribute("data-like"));
            paint();
            paintLike();
          };
        });
        document.querySelectorAll("[data-c]").forEach((b) => {
          b.onclick = (e) => {
            e.stopPropagation();
            const id = b.getAttribute("data-c");
            const t = all.find((x) => x.id === id);
            const post = (t && t.post) || { id, comments: [], likes: 0, text: (t && t.title) || "" };
            if (window.ZIVV_SOCIAL) ZIVV_SOCIAL.openComments(post, paint);
          };
        });
        document.querySelectorAll("[data-mix]").forEach((b) => {
          b.onclick = () => {
            const mix = mixes.find((m) => m.id === b.getAttribute("data-mix"));
            queue = mix.ids.map((id) => all.find((t) => t.id === id)).filter(Boolean);
            playAt(0);
          };
        });
        paintLike();
        paintShuffle();
      }

      document.getElementById("q").oninput = paint;
      paint();
    </script>
  </body>
