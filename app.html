<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ZIVV</title>
  <link rel="icon" href="brand/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    try {
      const t = localStorage.getItem("zivv.theme") || "light";
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
    } catch {}
  </script>
</head>
<body>
  <div id="ig-app">
    <!-- الشريط العلوي (كل الصفحات) -->
    <header class="topbar"><div class="tb-inner" id="tb-inner"></div></header>

    <!-- القايمة الجانبية (جنب الشعار) -->
    <div id="drawer-bg"></div>
    <aside id="drawer"></aside>

    <!-- المحتوى -->
    <main id="content">
      <section class="view" id="view-home"></section>
      <section class="view" id="view-explore"></section>
      <section class="view" id="view-create"></section>
      <section class="view" id="view-store"></section>
      <section class="view" id="view-reels"></section>
      <section class="view" id="view-chat"></section>
      <section class="view" id="view-ai"></section>
      <section class="view" id="view-notes"></section>
      <section class="view" id="view-profile"></section>
      <section class="view" id="view-post"></section>
      <section class="view" id="view-stats"></section>
      <section class="view" id="view-gold"></section>
      <section class="view" id="view-king"></section>
    </main>

    <!-- الشريط السفلي (الصفحات الرئيسية فقط) -->
    <nav class="bottomnav" id="bottomnav">
      <a data-route="home" href="#/home"><span class="ico">🏠</span>الرئيسية</a>
      <a data-route="explore" href="#/explore"><span class="ico">🔍</span>استكشاف</a>
      <a data-route="create" href="#/create" class="create-fab"><span class="fab-plus">+</span>إنشاء</a>
      <a data-route="reels" href="#/reels"><span class="ico">🎬</span>ريلز</a>
      <a data-route="profile" href="#/profile" id="bn-profile"><span class="bn-avatar" id="bn-avatar">؟</span>حسابي</a>
    </nav>
  </div>

  <div id="toasts"></div>
  <div id="modal-root"></div>

  <script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});</script>
  <script src="js/app.js"></script>
</body>
</html>
