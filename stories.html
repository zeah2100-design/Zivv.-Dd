<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIVV — الحالات</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: "Segoe UI", Tahoma, Arial, sans-serif; background: #000; color: #f5f5f5; min-height: 100dvh; }
      .add, .pick {
        border: 1px solid #262626;
        border-radius: 14px;
        padding: 14px;
        background: #0a0a0a;
        margin: 14px 0;
      }
      label { display: block; font-size: 13px; color: #a8a8a8; margin-bottom: 8px; }
      input[type="text"] {
        width: 100%;
        background: #121212;
        border: 1px solid #262626;
        color: #fff;
        border-radius: 10px;
        padding: 10px 12px;
        margin: 8px 0 12px;
      }
      .btn {
        border: 0;
        background: linear-gradient(135deg, #fcaf45, #e1306c, #833ab4);
        color: #fff;
        font-weight: 800;
        border-radius: 10px;
        padding: 10px 16px;
      }
      .row { display: flex; gap: 12px; overflow-x: auto; padding: 6px 0 16px; }
      .row::-webkit-scrollbar { display: none; }
      .card { flex: 0 0 118px; background: none; border: 0; color: #fff; text-align: start; }
      .thumb {
        width: 118px; height: 200px; object-fit: cover; border-radius: 14px;
        border: 2px solid #e1306c; background: #111; display: grid; place-items: center;
      }
      .mini {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        margin-top: 10px;
      }
      .mini button { padding: 0; border: 0; background: #111; border-radius: 8px; overflow: hidden; }
      .mini img, .mini video { width: 100%; height: 90px; object-fit: cover; display: block; }
      .view {
        display: none; position: fixed; inset: 0; z-index: 80; background: #000;
      }
      .view.open { display: grid; place-items: center; }
      .view img, .view video, .view .plain {
        width: min(420px, 100%); height: min(720px, 100%); object-fit: cover;
      }
      .view .plain {
        display: grid; place-items: center; padding: 28px; font-size: 22px;
        background: linear-gradient(160deg, #833ab4, #e1306c, #f77737);
      }
      .who { position: absolute; top: 18px; right: 18px; font-weight: 800; }
      .x { position: absolute; top: 12px; left: 12px; background: none; border: 0; color: #fff; font-size: 28px; }
      .hint { color: #888; font-size: 13px; line-height: 1.6; }
    </style>
  </head>
  <body>
    <main class="page-pad">
      <h1>الحالات</h1>
      <p class="hint">ارفع صورة أو فيديو من جهازك، أو اختار منشور/فيديو من الموقع.</p>

      <form class="add" id="add-story">
        <label>رفع من الجهاز (صورة أو فيديو)</label>
        <input id="story-file" type="file" accept="image/*,video/*" />
        <input id="story-text" type="text" maxlength="120" placeholder="أو اكتب جملة قصيرة" />
        <button class="btn" type="submit">نشر الحالة</button>
      </form>

      <div class="pick">
        <label>من منشورات الموقع</label>
        <div class="mini" id="from-site"></div>
      </div>

      <h2 style="font-size:15px;margin:8px 0">قصتك</h2>
      <div class="row" id="mine"></div>
      <h2 style="font-size:15px;margin:8px 0">حالات الناس</h2>
      <div class="row" id="others"></div>
    </main>

    <div class="view" id="view">
      <button class="x" id="close-view" type="button">×</button>
      <div class="who" id="view-who"></div>
      <img id="view-img" alt="" hidden />
      <video id="view-vid" controls playsinline hidden></video>
      <div class="plain" id="view-text" hidden></div>
    </div>

    <script src="js/core.js"></script>
    <script src="js/shell.js"></script>
    <script>
      const session = JSON.parse(localStorage.getItem("zivv.session") || "null") || { name: "أنت" };
      const seed = [];

      function loadMine() {
        try { return JSON.parse(localStorage.getItem("zivv.stories") || "[]"); }
        catch { return []; }
      }
      function saveMine(list) {
        localStorage.setItem("zivv.stories", JSON.stringify(list));
      }

      function card(s) {
        const media = s.kind === "video"
          ? `<video class="thumb" src="${s.video || s.image || ""}" muted></video>`
          : s.image
            ? `<img class="thumb" src="${s.image}" alt="">`
            : `<div class="thumb">Aa</div>`;
        return `<button class="card" data-id="${s.id}" type="button">${media}<b>${s.name}</b></button>`;
      }

      function render() {
        const mine = loadMine();
        document.getElementById("mine").innerHTML = mine.length ? mine.map(card).join("") : '<p class="hint">لسه ما نشرتش حالة.</p>';
        document.getElementById("others").innerHTML = seed.map(card).join("");
        document.querySelectorAll(".card").forEach((el) => {
          el.onclick = () => openView(el.getAttribute("data-id"));
        });
      }

      function sitePosts() {
        return (ZIVV_CORE.getPosts() || []).filter((p) => p.image);
      }

      document.getElementById("from-site").innerHTML = sitePosts().map((p) =>
        `<button type="button" data-id="${p.id}"><img src="${p.image}" alt=""></button>`
      ).join("");

      document.querySelectorAll("#from-site button").forEach((b) => {
        b.onclick = () => {
          const p = sitePosts().find((x) => x.id === b.getAttribute("data-id"));
          if (!p) return;
          const list = loadMine();
          list.unshift({
            id: "me_" + Date.now(),
            name: session.name || "أنت",
            text: p.text || "",
            image: p.image,
            video: p.type === "video" ? p.image : "",
            kind: p.type === "video" ? "video" : "image"
          });
          saveMine(list);
          render();
        };
      });

      function openView(id) {
        const s = loadMine().concat(seed).find((x) => x.id === id);
        if (!s) return;
        document.getElementById("view-who").textContent = s.name;
        const img = document.getElementById("view-img");
        const vid = document.getElementById("view-vid");
        const txt = document.getElementById("view-text");
        img.hidden = true; vid.hidden = true; txt.hidden = true;
        vid.pause();
        if (s.kind === "video" && (s.video || s.image)) {
          vid.src = s.video || s.image;
          vid.hidden = false;
          vid.play().catch(() => {});
        } else if (s.image) {
          img.src = s.image;
          img.hidden = false;
        } else {
          txt.textContent = s.text || "";
          txt.hidden = false;
        }
        document.getElementById("view").classList.add("open");
      }

      document.getElementById("close-view").onclick = () => {
        document.getElementById("view-vid").pause();
        document.getElementById("view").classList.remove("open");
      };

      document.getElementById("add-story").onsubmit = (e) => {
        e.preventDefault();
        const file = document.getElementById("story-file").files[0];
        const text = document.getElementById("story-text").value.trim();
        if (!file && !text) return;
        const push = (payload) => {
          const list = loadMine();
          list.unshift(payload);
          try { saveMine(list); }
          catch {
            payload.video = payload.video && payload.video.startsWith("data:") ? "" : payload.video;
            saveMine(list);
          }
          document.getElementById("story-text").value = "";
          document.getElementById("story-file").value = "";
          render();
        };
        if (!file) {
          push({ id: "me_" + Date.now(), name: session.name || "أنت", text, kind: "text" });
          return;
        }
        const isVid = file.type.startsWith("video/");
        const reader = new FileReader();
        reader.onload = () => {
          push({
            id: "me_" + Date.now(),
            name: session.name || "أنت",
            text,
            kind: isVid ? "video" : "image",
            image: isVid ? "" : reader.result,
            video: isVid ? reader.result : ""
          });
        };
        reader.readAsDataURL(file);
      };

      render();
    </script>
  </body>
</html>
