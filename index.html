<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ZIVV — تواصل اجتماعي ذكي</title>
  <meta name="description" content="ZIVV — منصة تواصل اجتماعي عربية بذكاء اصطناعي وقاعدة بيانات حقيقية" />
  <link rel="icon" href="brand/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css" />
  <script>
    try {
      const t = localStorage.getItem("zivv.theme");
      if (t) document.documentElement.setAttribute("data-theme", t);
      else if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme", "dark");
    } catch {}
  </script>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="auth-logo">
        <span class="mark">Z</span>
        <b>ZIVV</b>
      </div>
      <p class="auth-sub">منصة تواصل اجتماعي عربية — منشورات، دردشة، وذكاء اصطناعي «زيفي».</p>
      <span class="live-badge" id="db-badge"><i></i> متصل بقاعدة بيانات حقيقية</span>

      <div class="form-err" id="err"></div>

      <!-- Login -->
      <form id="login-form">
        <div class="field">
          <label>البريد الإلكتروني</label>
          <input class="input" id="li-email" type="email" placeholder="you@mail.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label>كلمة المرور</label>
          <input class="input" id="li-pass" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </div>
        <button class="btn block" type="submit" id="li-btn">تسجيل الدخول</button>
        <p class="auth-switch">معندكش حساب؟ <a href="#" id="go-register">إنشاء حساب جديد</a></p>
      </form>

      <!-- Register -->
      <form id="register-form" style="display:none">
        <div class="field">
          <label>الاسم</label>
          <input class="input" id="rg-name" placeholder="اسمك" required />
        </div>
        <div class="field">
          <label>اسم المستخدم (إنجليزي بدون مسافات)</label>
          <input class="input" id="rg-user" placeholder="username" required pattern="[A-Za-z0-9_.]{3,20}" />
        </div>
        <div class="field">
          <label>البريد الإلكتروني</label>
          <input class="input" id="rg-email" type="email" placeholder="you@mail.com" required autocomplete="email" />
        </div>
        <div class="field">
          <label>كلمة المرور (6 أحرف على الأقل)</label>
          <input class="input" id="rg-pass" type="password" placeholder="••••••••" required minlength="6" autocomplete="new-password" />
        </div>
        <button class="btn block" type="submit" id="rg-btn">إنشاء الحساب</button>
        <p class="auth-switch">عندك حساب؟ <a href="#" id="go-login">تسجيل الدخول</a></p>
      </form>

      <div class="demo-hint">حساب تجريبي — البريد: <code>demo@zivv.app</code> وكلمة المرور: <code>demo123</code></div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
    (function () {
      // لو مسجل دخول بالفعل روح للتطبيق
      try {
        const s = JSON.parse(localStorage.getItem("zivv.session") || "null");
        if (s && s.email) location.replace("app.html");
      } catch {}

      // حالة قاعدة البيانات (دائمة أم سحابية مؤقتة)
      fetch("/api/health").then((r) => r.json()).then((h) => {
        if (h && h.ephemeral) {
          const b = document.getElementById("db-badge");
          if (b) b.innerHTML = "<i></i> وضع سحابي مؤقت — البيانات قد تُمسح";
        }
      }).catch(() => {});

      const err = document.getElementById("err");
      const loginF = document.getElementById("login-form");
      const regF = document.getElementById("register-form");
      document.getElementById("go-register").onclick = (e) => { e.preventDefault(); showErr(""); loginF.style.display = "none"; regF.style.display = ""; };
      document.getElementById("go-login").onclick = (e) => { e.preventDefault(); showErr(""); regF.style.display = "none"; loginF.style.display = ""; };

      function showErr(m) { err.textContent = m || ""; err.classList.toggle("show", !!m); }

      async function api(path, opts) {
        const r = await fetch("/api" + path, {
          headers: { "Content-Type": "application/json" },
          ...opts,
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(data.error || ("خطأ " + r.status));
        return data;
      }

      loginF.onsubmit = async (e) => {
        e.preventDefault();
        showErr("");
        const btn = document.getElementById("li-btn");
        btn.disabled = true; btn.textContent = "جاري الدخول…";
        try {
          const email = document.getElementById("li-email").value.trim();
          const password = document.getElementById("li-pass").value;
          const out = await api("/auth/login", { method: "POST", body: JSON.stringify({ email, password }) });
          localStorage.setItem("zivv.session", JSON.stringify(out.user));
          location.replace("app.html");
        } catch (ex) { showErr(ex.message === "invalid credentials - بيانات خاطئة" || ex.message === "invalid credentials - كلمة المرور خاطئة" || ex.message === "invalid credentials" ? "بيانات الدخول غير صحيحة" : "تعذر الدخول: " + ex.message); }
        finally { btn.disabled = false; btn.textContent = "تسجيل الدخول"; }
      };

      regF.onsubmit = async (e) => {
        e.preventDefault();
        showErr("");
        const btn = document.getElementById("rg-btn");
        btn.disabled = true; btn.textContent = "جاري إنشاء الحساب…";
        try {
          const name = document.getElementById("rg-name").value.trim();
          const username = document.getElementById("rg-user").value.trim().toLowerCase();
          const email = document.getElementById("rg-email").value.trim();
          const password = document.getElementById("rg-pass").value;
          const out = await api("/auth/register", { method: "POST", body: JSON.stringify({ name, username, email, password }) });
          localStorage.setItem("zivv.session", JSON.stringify(out.user));
          location.replace("app.html");
        } catch (ex) { showErr(ex.message.includes("exists") ? "هذا البريد مسجل بالفعل — سجل الدخول" : "تعذر إنشاء الحساب: " + ex.message); }
        finally { btn.disabled = false; btn.textContent = "إنشاء الحساب"; }
      };
    })();
  </script>
</body>
</html>
