<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZIVV</title>
    <style>
      :root {
        --ig: linear-gradient(135deg, #fcaf45 0%, #f77737 22%, #e1306c 55%, #c13584 78%, #833ab4 100%);
        --yellow: #fcaf45;
        --orange: #f77737;
        --pink: #e1306c;
        --magenta: #c13584;
        --purple: #833ab4;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { min-height: 100%; }
      body {
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        background:
          radial-gradient(900px 420px at 10% -10%, rgba(252,175,69,.12), transparent 50%),
          radial-gradient(800px 380px at 110% 110%, rgba(131,58,180,.18), transparent 46%),
          #000;
        color: #f5f5f5;
      }
      button, input, select { font-family: inherit; }
      button { cursor: pointer; }
      .hidden { display: none !important; }
      .wrap {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 28px 16px;
      }
      .box {
        width: min(380px, 100%);
        position: relative;
        background: #000;
        padding: 36px 28px 28px;
        border-radius: 16px;
      }
      .box::before {
        content: "";
        position: absolute;
        inset: 0;
        padding: 1px;
        border-radius: 16px;
        background: var(--ig);
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
        mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        mask-composite: exclude;
        pointer-events: none;
      }
      .logo {
        width: 80px;
        height: 80px;
        display: block;
        margin: 0 auto 10px;
        border-radius: 18px;
        overflow: hidden;
        background: #000;
      }
      h1 {
        text-align: center;
        font-weight: 800;
        letter-spacing: 0.36em;
        font-size: 20px;
        margin-bottom: 22px;
        background: var(--ig);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid #262626;
        margin-bottom: 20px;
      }
      .tabs button {
        background: none;
        border: 0;
        color: #737373;
        padding: 10px 4px;
        font-size: 14px;
        font-weight: 700;
      }
      .tabs button.on {
        color: #fff;
        box-shadow: inset 0 -2px 0 transparent;
        border-image: var(--ig) 1;
        border-bottom: 2px solid #e1306c;
      }
      input, select {
        width: 100%;
        background: #121212;
        border: 1px solid #262626;
        color: #fff;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        outline: none;
        font-size: 14px;
      }
      input:focus, select:focus {
        border-color: #e1306c;
        box-shadow: 0 0 0 3px rgba(225,48,108,.18);
      }
      select option { background: #121212; }
      .btn {
        width: 100%;
        border: 0;
        background: var(--ig);
        color: #fff;
        font-weight: 800;
        border-radius: 10px;
        padding: 12px 14px;
        margin-top: 4px;
      }
      .btn:disabled { opacity: 0.45; }
      .link {
        display: block;
        width: 100%;
        margin-top: 12px;
        background: none;
        border: 0;
        color: #c13584;
        font-size: 13px;
      }
      .hint, .lead {
        color: #a8a8a8;
        font-size: 13px;
        line-height: 1.6;
        margin-bottom: 12px;
      }
      .msg {
        font-size: 13px;
        line-height: 1.55;
        margin-bottom: 12px;
        padding: 10px 12px;
        border-radius: 8px;
      }
      .msg.err { background: rgba(225,48,108,.1); color: #ffb3c8; border: 1px solid rgba(225,48,108,.35); }
      .msg.ok { background: rgba(252,175,69,.08); color: #ffe0a8; border: 1px solid rgba(252,175,69,.3); }
      .otp {
        display: flex;
        gap: 6px;
        direction: ltr;
        justify-content: center;
        margin: 8px 0 14px;
      }
      .otp input {
        width: 42px;
        height: 48px;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        margin: 0;
      }
      fieldset {
        border: 1px solid #262626;
        border-radius: 10px;
        padding: 10px 12px;
        margin-bottom: 10px;
      }
      legend { color: #fff; font-size: 13px; padding: 0 6px; }
      fieldset label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-inline-end: 14px;
        font-size: 13px;
        color: #d4d4d4;
      }
      fieldset input { width: auto; margin: 0; accent-color: #e1306c; }
      .stack span { display: block; font-size: 13px; margin-bottom: 6px; }
      .okname {
        text-align: center;
        font-weight: 800;
        margin-bottom: 8px;
        background: var(--ig);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .foot { margin-top: 16px; color: #737373; font-size: 12px; }
      .lang { background: none; border: 0; color: #737373; padding: 0 4px; }
      .lang.on {
        background: var(--ig);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        font-weight: 800;
      }
    </style>
  </head>

        <h1>ZIVV</h1>

        <div class="tabs" id="auth-tabs">
          <button type="button" id="tab-login" class="on">تسجيل الدخول</button>
          <button type="button" id="tab-signup">إنشاء حساب</button>
        </div>
        <div id="msg"></div>

        <form id="form-login">
          <input id="login-first" type="text" required placeholder="الاسم" />
          <input id="login-last" type="text" required placeholder="اسم العائلة" />
          <input id="login-age" type="number" min="18" max="120" required placeholder="السن" />
          <input id="login-mark" type="text" required placeholder="العلامة المميزة" />
          <input id="login-pass" type="password" required placeholder="كلمة المرور" />
          <button class="btn" type="submit">دخول</button>
        </form>

        <form id="form-signup" class="hidden">
          <input id="signup-first" type="text" required placeholder="الاسم" />
          <input id="signup-last" type="text" required placeholder="اسم العائلة" />
          <input id="signup-age" type="number" min="18" max="120" required placeholder="السن" />
          <input id="signup-email" type="email" required placeholder="البريد الإلكتروني" />
          <input id="signup-pass" type="password" required placeholder="كلمة المرور" />
          <input id="signup-pass2" type="password" required placeholder="تأكيد كلمة المرور" />
          <input id="signup-mark" type="text" required placeholder="العلامة المميزة (كلام بس)" />
          <p class="hint">العلامة كلام فقط، ومش نفس الاسم أو اسم العائلة. ZIVV من 18 سنة.</p>
          <button class="btn" type="submit">إنشاء حساب</button>
        </form>

              <option value="other">أخرى</option>
            </select>
          </label>
          <input id="heard-other" class="hidden" type="text" placeholder="اكتب المصدر" />
          <button class="btn" type="submit">ابدأ</button>
        </form>

        <div id="done" class="hidden">
          <p class="okname" id="done-name"></p>
          <p class="hint">الحساب جاهز.</p>
          <a class="btn" href="home.html" style="display:block;text-align:center;text-decoration:none">الصفحة الرئيسية</a>
          <button class="link" type="button" id="out-btn">خروج</button>
        </div>
      </section>
      <p class="foot">
        <button type="button" id="btn-ar" class="lang on">عربي</button>
        ·
        <button type="button" id="btn-en" class="lang">EN</button>
      </p>
    </main>
    <script src="js/supabase-config.js"></script>
    <script src="js/db.js"></script>
    <script>
      const T = {
        ar: {
          login: "تسجيل الدخول", signup: "إنشاء حساب", go: "دخول",
          first: "الاسم", last: "اسم العائلة", age: "السن", email: "البريد الإلكتروني",
          pass: "كلمة المرور", pass2: "تأكيد كلمة المرور", mark: "العلامة المميزة (كلام بس)",
          ageHint: "العلامة كلام فقط، ومش نفس الاسم أو اسم العائلة. ZIVV من 18 سنة.",
          quiz: "جاوب على الأسئلة دي عشان نكمّل.",
          q1: "هل أنت صانع محتوى؟", q2: "هل أنت بائع منتجات؟", q3: "هل أنت فنان؟",
          q4: "سمعت عنا إزاي؟", yes: "نعم", no: "لا", choose: "اختار",
          f: "صديق", ig: "إنستجرام", tt: "تيك توك", g: "جوجل", o: "أخرى",
          other: "اكتب المصدر", start: "ابدأ",
          done: "الحساب جاهز.", out: "خروج",
          needAge: "السن لازم 18 أو أكثر.", needName: "اكتب الاسم واسم العائلة.",
          needMark: "العلامة كلام بس، ومش نفس الاسم أو العائلة.",
          needPass: "كلمة المرور قصيرة أو التأكيد مش مطابق.",
          needAll: "لازم تجاوب على كل الأسئلة.",
          exists: "الحساب موجود. سجّل دخول.",
          missing: "البيانات مش مطابقة لأي حساب.",
          make: "إنشاء حساب"
        },
        en: {
          login: "Log in", signup: "Sign up", go: "Enter",
          first: "First name", last: "Family name", age: "Age", email: "Email",
          pass: "Password", pass2: "Confirm password", mark: "Unique mark (words only)",
          ageHint: "The mark is words only, not your first or family name. ZIVV is 18+.",
          quiz: "Answer these to continue.",
          q1: "Are you a content creator?", q2: "Are you a product seller?", q3: "Are you an artist?",
          q4: "How did you hear about us?", yes: "Yes", no: "No", choose: "Choose",
          f: "Friend", ig: "Instagram", tt: "TikTok", g: "Google", o: "Other",
          other: "Tell us where", start: "Start",
          done: "You're set.", out: "Log out",
          needAge: "You must be 18 or older.", needName: "Enter first and family name.",
          needMark: "Mark must be words only, and not your name.",
          needPass: "Password too short or confirmation does not match.",
          needAll: "Answer every question.",
          exists: "Account exists. Log in.",
          missing: "No matching account.",
          make: "Create account"
        }
      };
      const $ = (id) => document.getElementById(id);
      let lang = localStorage.getItem("zivv.lang") || "ar";
      let mode = "login";
      let pending = null;

      function users() {
        try { return JSON.parse(localStorage.getItem("zivv.users") || "{}"); }
        catch { return {}; }
      }
      function saveUsers(u) { localStorage.setItem("zivv.users", JSON.stringify(u)); }
      function t() { return T[lang]; }
      function cleanName(s) {
        return String(s || "").replace(/\s+/g, " ").trim();
      }
      function fold(s) {
        return cleanName(s).toLowerCase()
          .replace(/[أإآ]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه");
      }
      function isWords(s) {
        return /^[\p{L} ]{3,40}$/u.test(cleanName(s));
      }
      function markOk(mark, first, last) {
        const m = fold(mark);
        const f = fold(first);
        const l = fold(last);
        if (!isWords(mark)) return false;
        if (m === f || m === l) return false;
        if (m === f + " " + l || m === l + " " + f) return false;
        return true;
      }
      function findUser(first, last, mark, pass, age) {
        const db = users();
        const f = fold(first), l = fold(last), m = fold(mark), a = String(age);
        return Object.keys(db).map((k) => db[k]).find((u) =>
          fold(u.first) === f && fold(u.last) === l && fold(u.mark) === m &&
          String(u.password) === String(pass) && String(u.age) === a
        ) || null;
      }
      function uname(first, email) {
        const fromMail = String(email || "").split("@")[0].replace(/[^a-zA-Z0-9_]/g, "");
        if (fromMail.length >= 3) return fromMail.toLowerCase();
        return ("u" + Date.now()).slice(0, 12);
      }

      function apply() {
        const p = t();
        document.documentElement.lang = lang === "ar" ? "ar" : "en";
        document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
        $("tab-login").textContent = p.login;
        $("tab-signup").textContent = p.signup;
        $("login-first").placeholder = p.first;
        $("login-last").placeholder = p.last;
        $("login-age").placeholder = p.age;
        $("login-mark").placeholder = p.mark;
        $("login-pass").placeholder = p.pass;
        $("signup-first").placeholder = p.first;
        $("signup-last").placeholder = p.last;
        $("signup-age").placeholder = p.age;
        $("signup-email").placeholder = p.email;
        $("signup-pass").placeholder = p.pass;
        $("signup-pass2").placeholder = p.pass2;
        $("signup-mark").placeholder = p.mark;
        document.querySelector("#form-login .btn").textContent = p.go;
        document.querySelector("#form-signup .btn").textContent = p.make;
        document.querySelector("#form-signup .hint").textContent = p.ageHint;
        document.querySelector("#form-quiz .lead").textContent = p.quiz;
        const legs = document.querySelectorAll("#form-quiz legend");
        legs[0].textContent = p.q1; legs[1].textContent = p.q2; legs[2].textContent = p.q3;
        document.querySelectorAll("#form-quiz fieldset").forEach((fs) => {
          const labels = fs.querySelectorAll("label");
          labels[0].lastChild.textContent = " " + p.yes;
          labels[1].lastChild.textContent = " " + p.no;
        });
        document.querySelector("#form-quiz .stack span").textContent = p.q4;
        const opts = $("heard").options;
        opts[0].text = p.choose; opts[1].text = p.f; opts[2].text = p.ig;
        opts[3].text = p.tt; opts[4].text = p.g; opts[5].text = p.o;
        $("heard-other").placeholder = p.other;
        document.querySelector("#form-quiz .btn").textContent = p.start;
        document.querySelector("#done .hint").textContent = p.done;
        $("out-btn").textContent = p.out;
        $("btn-ar").classList.toggle("on", lang === "ar");
        $("btn-en").classList.toggle("on", lang === "en");
        localStorage.setItem("zivv.lang", lang);
      }

      function show(id) {
        ["form-login","form-signup","form-quiz","done","auth-tabs"].forEach((x) => {
          const hide = x === "auth-tabs"
            ? (id === "form-quiz" || id === "done")
            : x !== id;
          $(x).classList.toggle("hidden", hide);
        });
      }
      function msg(text, kind) {
        $("msg").innerHTML = text ? `<div class="msg ${kind}">${text}</div>` : "";
      }
      function setTab(m) {
        mode = m;
        $("tab-login").classList.toggle("on", m === "login");
        $("tab-signup").classList.toggle("on", m === "signup");
        show(m === "login" ? "form-login" : "form-signup");
        msg("");
      }

      $("tab-login").onclick = () => setTab("login");
      $("tab-signup").onclick = () => setTab("signup");
      $("btn-ar").onclick = () => { lang = "ar"; apply(); };
      $("btn-en").onclick = () => { lang = "en"; apply(); };

      $("form-login").onsubmit = (e) => {
        e.preventDefault();
        const first = cleanName($("login-first").value);
        const last = cleanName($("login-last").value);
        const age = Number($("login-age").value);
        const mark = cleanName($("login-mark").value);
        const pass = $("login-pass").value;
        if (!age || age < 18) { msg(t().needAge, "err"); return; }
        const u = findUser(first, last, mark, pass, age);
        if (!u) { msg(t().missing, "err"); return; }
        pending = u;
        localStorage.setItem("zivv.session", JSON.stringify(u));
        if (window.ZIVV_DB) ZIVV_DB.upsertProfile(u);
        msg("", "");
        if (u.onboarding) paint(u);
        else show("form-quiz");
      };

      $("form-signup").onsubmit = (e) => {
        e.preventDefault();
        const first = cleanName($("signup-first").value);
        const last = cleanName($("signup-last").value);
        const age = Number($("signup-age").value);
        const email = $("signup-email").value.trim().toLowerCase();
        const pass = $("signup-pass").value;
        const pass2 = $("signup-pass2").value;
        const mark = cleanName($("signup-mark").value);
        if (first.length < 2 || last.length < 2) { msg(t().needName, "err"); return; }
        if (!age || age < 18) { msg(t().needAge, "err"); return; }
        if (!markOk(mark, first, last)) { msg(t().needMark, "err"); return; }
        if (pass.length < 4 || pass !== pass2) { msg(t().needPass, "err"); return; }
        const db = users();
        if (db[email]) { msg(t().exists, "err"); return; }
        const u = {
          email, first, last, name: first + " " + last, age, password: pass, mark,
          username: uname(first, email)
        };
        db[email] = u;
        saveUsers(db);
        pending = u;
        localStorage.setItem("zivv.session", JSON.stringify(u));
        if (window.ZIVV_DB) ZIVV_DB.upsertProfile(u);
        msg("", "");
        show("form-quiz");
      };

      $("heard").onchange = () => $("heard-other").classList.toggle("hidden", $("heard").value !== "other");

      $("form-quiz").onsubmit = (e) => {
        e.preventDefault();
        const creator = document.querySelector("input[name=creator]:checked");
        const seller = document.querySelector("input[name=seller]:checked");
        const artist = document.querySelector("input[name=artist]:checked");
        const heard = $("heard").value;
        if (!creator || !seller || !artist || !heard) { msg(t().needAll, "err"); return; }
        if (heard === "other" && !$("heard-other").value.trim()) { msg(t().needAll, "err"); return; }
        const db = users();
        const email = pending.email;
        db[email].onboarding = {
          creator: creator.value === "yes",
          seller: seller.value === "yes",
          artist: artist.value === "yes",
          heard,
          heardOther: $("heard-other").value.trim()
        };
        saveUsers(db);
        localStorage.setItem("zivv.session", JSON.stringify(db[email]));
        paint(db[email]);
      };

      $("out-btn").onclick = () => {
        localStorage.removeItem("zivv.session");
        setTab("login");
      };

      function paint(u) {
        $("done-name").textContent = u.name || u.email;
        const hint = document.querySelector("#done .hint");
        if (hint) hint.textContent = "الحساب جاهز. هتفتح الصفحة الرئيسية.";
        const go = document.querySelector("#done .btn");
        if (go) {
          go.setAttribute("href", "home.html");
          go.textContent = "الصفحة الرئيسية";
        }
        show("done");
        setTimeout(function () {
          location.href = "home.html";
        }, 400);
      }

      apply();
      const s = JSON.parse(localStorage.getItem("zivv.session") || "null");
      if (s && (s.email || s.mark) && s.password) {
        pending = s;
        if (s.onboarding) paint(s);
        else show("form-quiz");
      }
    </script>
  </body>
</html>
